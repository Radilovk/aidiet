      el.querySelector('#c-go').onclick = async (ev) => {
        const btn = ev.currentTarget;
        busy(btn, 'Проверка на картата…');
        const res = await stripe.confirmSetup({ elements, redirect: 'if_required',
          confirmParams: { return_url: location.href.split('#')[0], payment_method_data: { billing_details: { name: me.name, phone: me.phone, email: me.email || undefined,
            address: { country: 'BG', postal_code: '', city: '', line1: '', line2: '', state: '' } } } } });
        if (res.error || !res.setupIntent || res.setupIntent.status !== 'succeeded') {
          unbusy(btn);
          btn.innerHTML = `${ic('lock')}Опитай отново`;
          el.querySelector('#c-err').textContent = (res.error && res.error.message) || 'Картата не беше потвърдена.';
          return;
        }
        btn.textContent = 'Записване…';
        await sendBook({ setupIntent: res.setupIntent.id });
      };
    } catch (_) {
      el.querySelector('#pay').innerHTML = '<p class="err">Формата за карта не се зареди. Проверете връзката.</p>';
    }
  }

  let tickedNow = false;   // the rules were ticked in THIS booking (only then the acceptance is recorded)
  async function sendBook(extra) {
    const times = picked.slice();
    const r = await api('POST', 'book', { ...me, times, token: me.token, terms: tickedNow || undefined, termsText: tickedNow ? termsText() : undefined, termsVer: tickedNow ? me.termsV : undefined,
      code: codeOk(me.code) ? me.code.code : undefined, ...extra }).catch(() => ({ status: 0, d: {} }));
    const d = r.d || {};
    if (d.token) me.token = d.token;
    if (d.card) me.card = d.card;
    if (d.code) me.code = d.code;
    save('me', me);
    if (r.status === 0) { openBook('Няма връзка. Опитайте отново.'); return; }
    const errs = { terms: 'Моля, приемете условията.', card_required: 'Нужна е карта като гаранция.', code: 'Кодът не важи — махнах го.',
      code_used: 'Кодът е изчерпан — махнах го.', calendar: 'Календарът на студиото не отговаря. Опитайте след малко.', stripe: 'Проблем с картата. Опитайте отново.',
      who: 'Проверете името и телефона.', max_per_day: `Най-много ${cfg.rules.maxPerDay} час(а) на ден.`, max_upcoming: `Най-много ${cfg.rules.maxUpcoming} предстоящи часа.` };
    if (d.error) {
      if (d.error === 'code' || d.error === 'code_used') { me.code = null; save('me', me); }
      if (d.error === 'card_required') { if (me.card) { me.card = null; save('me', me); } cardStep(true); return; }
      if (d.error === 'terms') { me.token = ''; save('me', me); }
      openBook(errs[d.error] || (r.status === 429 ? 'Твърде много опити — след малко.' : 'Записването не успя. Опитайте отново.'));
      return;
    }
    tickedNow = false;
    const booked = (d.booked || []).map((x) => x.time);
    const failed = d.failed || [];
    picked = picked.filter((t) => !booked.includes(t) && !failed.some((f) => f.time === t));
    save('picked', picked);
    Object.keys(months).forEach((k) => { months[k].at = 0; });
    await Promise.all([refreshMine(booked.length > 0), ensureMonth(ymOf(view.y, view.m), true)]);
    renderCal();
    renderBar();
    showDone(booked, failed);
  }

  /* a light tap on picking an hour, a "done" tap after a booking (the phone app only) */
  function haptic(kind) {
    try {
      const H = APP && window.Capacitor.Plugins && window.Capacitor.Plugins.Haptics;
      if (!H) return;
      if (kind === 'ok') H.notification({ type: 'SUCCESS' }); else H.impact({ style: 'LIGHT' });
    } catch (_) {}
  }

  /* ── reminders: the phone's own notifications (Capacitor LocalNotifications), set when an hour is booked and re-set
        whenever the list of hours changes — no server, no internet at the time. N hours before (the studio's setting,
        4 by default); never at night: before 07:00 it moves to 07:00, if that is still ≥ 30 min ahead of the hour. ── */
  const REM_BASE = 1000000000;   // our ids: 1e9 … 2e9 (a booking's id, folded)
  function nativeLN() { return APP && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications; }
  function reminderAt(startMs, now) {
    const h = cfg && cfg.rules ? cfg.rules.reminderHours : 0;
    if (!h) return null;
    let at = startMs - h * 3600e3;
    const p = zonedParts(at, tz());
    if (p.hm < '07:00') {
      at = zonedMs(p.ymd, '07:00', tz());
      if (startMs - at < 30 * 60e3) return null;
    }

  function remId(bookingId, k = 0) { return REM_BASE + (parseInt(String(bookingId).slice(0, 7), 16) % 300000000) * 3 + k; }   // k: 0 the main one, 1 the evening before, 2 an hour before
  const WEEK_BASE = 1950000000;   // the Sunday reminders (next to the hours' ids, which stay under 1.9e9)
  const remPrefs = () => ({ hours: true, weekly: false, ...load('remPrefs', {}) });
  const WD_SHORT = ['Нд', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
  const NUDGES = ['Нова седмица, нова енергия. Запази своя час.', 'Време е за тренировка. Избери удобен час.', 'Една тренировка тази седмица прави разлика.'];
  const remTitle = (x) => (x.kind === 'week' && x.week.length ? `Твоята седмица · ${cfg.brand.name}` : cfg.brand.name);
  function remBody(x) {
    const hm = zonedParts(x.start || 0, tz()).hm;
    if (x.kind === 'eve') return `Утре в ${x.hms.join(' и ')} — очакваме те.`;
    if (x.kind === 'week') {
      if (!x.week.length) return NUDGES[x.n % NUDGES.length];
      const list = x.week.map(({ h }) => `${WD_SHORT[new Date(h.time.slice(0, 10) + 'T12:00:00Z').getUTCDay()]} ${h.time.slice(11)}`);
      return list.slice(0, 4).join(' · ') + (list.length > 4 ? ` · +${list.length - 4}` : '');

  }

  /* the offer to turn reminders on: a card inside the "Записани ✓" sheet that shows what the reminder will look like; the phone's own

  async function reminderOffer() {

  function setRemPref(k, v) { save('remPrefs', { ...remPrefs(), [k]: v }); syncReminders(false); }
  function openReminders() {

      <label class="tick"><input type="checkbox" id="rp-hours" ${p.hours ? 'checked' : ''}><span>Преди всеки час<small class="muted" style="display:block">Вечерта преди в 19:00${h ? ` и ${h} ч. преди` : ''}</small></span></label>
      <label class="tick"><input type="checkbox" id="rp-week" ${p.weekly ? 'checked' : ''}><span>Моята седмица<small class="muted" style="display:block">В неделя в 18:00 — часовете за седмицата или покана за нов</small></span></label>
      <p class="small muted">Звук и вибрация — според настройките на телефона.</p>

      setRemPref('weekly', e.target.checked);

  }
  let lnReady = false;
  function setupNotificationTaps(ln) {   // a tap on the reminder (or its buttons) opens the right place in the app
    if (lnReady || !ln || !ln.addListener) return;
    lnReady = true;
    try {
      if (ln.registerActionTypes) ln.registerActionTypes({ types: [{ id: 'HOUR', actions: [{ id: 'open', title: 'Моите часове' }, { id: 'map', title: 'Навигация' }] }] });
      ln.addListener('localNotificationActionPerformed', (ev) => {
        if (ev && ev.actionId === 'map' && mapLink()) { location.href = mapLink(); return; }
        if (ev && ev.notification && ev.notification.extra && ev.notification.extra.weekly) { $('cal-card').scrollIntoView({ behavior: 'smooth' }); return; }
        showUpcoming(ev && ev.notification && ev.notification.extra && ev.notification.extra.id, true);
      });

    } catch (_) {}
  }
  async function syncReminders(ask) {
    const ln = nativeLN();
    if (!ln || !cfg) return;
    try {
      const now = Date.now();
      /* the reminders: the day before at 19:00 (one per day, all its hours), 4 h before each hour (the studio's setting; before
         07:00 → 07:00), and — only if the client turned it on — every Sunday at 18:00: the coming week's hours, or a light nudge */
      const prefs = remPrefs();
      const items = [];
      const booked = mine.filter((x) => x.status === 'booked').map((h) => ({ h, start: zonedMs(h.time.slice(0, 10), h.time.slice(11), tz()) }))
        .filter((x) => x.start > now).sort((a, b) => a.start - b.start);
      if (prefs.hours) {
        const byDay = {};
        for (const { h, start } of booked) {
          const main = reminderAt(start, now);
          if (main) items.push({ id: remId(h.id, 0), bid: h.id, start, at: main, kind: 'main' });
          (byDay[h.time.slice(0, 10)] = byDay[h.time.slice(0, 10)] || []).push({ h, start });
        }
        for (const [day, list] of Object.entries(byDay)) {
          const eve = zonedMs(zonedParts(zonedMs(day, '12:00', tz()) - 864e5, tz()).ymd, '19:00', tz());
          if (eve > now + 30e3) items.push({ id: remId(list[0].h.id, 1), bid: list[0].h.id, start: list[0].start, at: eve, kind: 'eve', hms: list.map((x) => x.h.time.slice(11)) });
        }
      }
      if (prefs.weekly) {
        let sun = zonedParts(now, tz()).ymd;
        while (new Date(sun + 'T12:00:00Z').getUTCDay() !== 0) sun = zonedParts(zonedMs(sun, '12:00', tz()) + 864e5, tz()).ymd;
        for (let i = 0; i < 6; i++) {
          const at = zonedMs(sun, '18:00', tz());
          const from = zonedMs(sun, '23:59', tz()), to = from + 7 * 864e5;
          if (at > now + 30e3) items.push({ id: WEEK_BASE + i, at, kind: 'week', n: i, week: booked.filter((x) => x.start > from && x.start <= to) });
          sun = zonedParts(zonedMs(sun, '12:00', tz()) + 7 * 864e5, tz()).ymd;
        }
      }
      items.sort((a, b) => a.at - b.at).splice(60);   // iOS keeps at most 64 pending notifications
      const pend = ((await ln.getPending()).notifications || []).filter((n) => n.id >= REM_BASE && n.id < 2 * REM_BASE);
      if (!items.length && !pend.length) return;
      let perm = (await ln.checkPermissions()).display;
      if (perm !== 'granted') {
        if (ask && items.length && perm === 'denied') toast('Известията са изключени — включете ги от настройките на телефона, за да получавате напомняния.', 5000);
        return;
      }
      if (pend.length) await ln.cancel({ notifications: pend.map((n) => ({ id: n.id })) });
      if (isAndroid() && ln.createChannel && !androidChannel) {   // Android 8+: the sound and vibration live on the channel
        androidChannel = true;
        await ln.createChannel({ id: 'studio', name: 'Напомняния', description: 'Напомняния за записаните часове', importance: 4, visibility: 1, sound: 'studio.wav', vibration: true }).catch(() => {});
      }
      setupPush();
      if (items.length) {
        setupNotificationTaps(ln);
        await ln.schedule({ notifications: items.map((x) => ({
          id: x.id, title: remTitle(x), body: remBody(x), actionTypeId: 'HOUR', group: STUDIO, threadIdentifier: STUDIO, extra: x.kind === 'week' ? { weekly: true } : { id: x.bid },
          sound: remSound(), relevanceScore: 1, interruptionLevel: 'active', ...(isAndroid() ? { channelId: 'studio' } : {}),   // a normal alert with sound — respects Focus / Do Not Disturb
          schedule: { at: new Date(x.at), allowWhileIdle: true },

      }

  }
  /* ── push (app 1.2+, iOS): the studio's own changes reach the phone at once (booked / canceled by the studio, a word to
        the clients with hours ahead). The same permission as the reminders — no second question. Older apps: nothing. ── */
  const pushPlugin = () => (APP && window.Capacitor.getPlatform && window.Capacitor.getPlatform() === 'ios' && window.Capacitor.Plugins.PushNotifications) || null;
  const isAndroid = () => Boolean(APP && window.Capacitor.getPlatform && window.Capacitor.getPlatform() === 'android');
  let androidChannel = false;
  const remSound = () => (pushPlugin() || isAndroid() ? 'studio.wav' : 'default');   // the studio's soft chime ships with 1.2; before it, the phone's sound
  let pushReady = false;
  async function setupPush() {
    const pn = pushPlugin();

      if (!pushReady) {

          if (r && r.status === 200) save('pushTok', key);
        });
        // in the app when it comes: the list is fresh at once (the phone shows the banner itself)
        pn.addListener('pushNotificationReceived', () => refreshMine());
        pn.addListener('pushNotificationActionPerformed', async (ev) => {
          const d = (ev && ev.notification && ev.notification.data) || {};
          await refreshMine();

          else if (d.kind === 'canceled') $('cal-card').scrollIntoView({ behavior: 'smooth' });
        });

    } catch (e) { console.warn('push', e); }

  /* ── Android (APK outside Google Play): a new version is offered in the app itself — checked at most twice a day,
        one small request to GitHub; "Обнови" opens the download in the phone's browser ── */
  const APK_URL = 'https://github.com/Radilovk/aidiet/releases/download/studio-android-latest/XB-Studio.apk';
  const newer = (a, b) => { const x = String(a).split('.').map(Number), y = String(b).split('.').map(Number);
    for (let i = 0; i < 3; i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0); } return false; };
  async function checkApkUpdate() {
    const capApp = isAndroid() && window.Capacitor.Plugins.App;

        const d = r.ok ? await r.json() : null;

  /* ── done: the hours + add to the phone's calendar ── */
  function icsFor(times) {
    const st = cfg;
    const z = (ms) => new Date(ms).toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
    const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//studio//bg', 'CALSCALE:GREGORIAN'];
    times.forEach((t, i) => {
      const s = zonedMs(t.slice(0, 10), t.slice(11), tz());
      lines.push('BEGIN:VEVENT', `UID:${STUDIO}-${s}-${i}@studio`, `DTSTAMP:${z(Date.now())}`, `DTSTART:${z(s)}`, `DTEND:${z(s + st.slot.minutes * 60000)}`,
        `SUMMARY:${st.brand.name.replace(/[,;]/g, ' ')}`, `LOCATION:${(st.address || '').replace(/[,;]/g, ' ')}`,
        ...(st.rules.reminderHours ? ['BEGIN:VALARM', `TRIGGER:-PT${st.rules.reminderHours}H`, 'ACTION:DISPLAY', 'DESCRIPTION:Напомняне', 'END:VALARM'] : []), 'END:VEVENT');
    });
    lines.push('END:VCALENDAR');
    return 'data:text/calendar;charset=utf-8,' + encodeURIComponent(lines.join('\r\n'));
  }
  function gcalLink(t) {
    const s = zonedMs(t.slice(0, 10), t.slice(11), tz());
    const z = (ms) => new Date(ms).toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
    return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(cfg.brand.name) +
      `&dates=${z(s)}/${z(s + cfg.slot.minutes * 60000)}&location=` + encodeURIComponent(cfg.address || '');
  }

      <div id="rem-slot"></div>

  /* ── the rules (Правила и условия): built from the studio's own settings, so what the client accepts is exactly what applies.
        The same text is what the booking sends with the tick (the server keeps it with the time of acceptance). ── */
  function termsParts() {
    const free = cfg.rules.freeCancelHours;
    const card = Boolean(cfg.card) && cfg.guarantee !== 'none';
    const parts = [];
    const book = ['Часовете се записват в приложението на студиото.'];
    if (card && cfg.guarantee === 'card') book.push('При записване се дава карта като гаранция. От нея не се тегли нищо при записването.');

    parts.push(['Записване на час', book]);

    if (free) cancel.push(card ? `При промяна или отказ по-малко от ${free} ч. преди часа, както и при неявяване, часът се таксува автоматично от картата Ви и сумата не се възстановява.`
      : `При промяна или отказ по-малко от ${free} ч. преди часа, както и при неявяване, часът се счита за проведен и студиото може да търси заплащането му.`);
    else if (card) cancel.push('При неявяване часът се таксува автоматично от картата Ви.');
    parts.push(['Промяна, отказ и неявяване', cancel]);
    if (cfg.viber) parts.push(['Напомняния', ['Потвърждения и напомняния получавате по Viber на посочения телефон. Напомнянията са част от услугата.']]);
    else if (cfg.rules.reminderHours) parts.push(['Напомняния', [`Приложението Ви напомня с известие на телефона вечерта преди часа и ${cfg.rules.reminderHours} ч. преди него. По желание — и всяка неделя с часовете за седмицата. Включват се и се изключват от Профил → Напомняния.`]]);
    parts.push(['Лични данни', ['Името, телефонът и (по желание) имейлът се ползват само за записванията, напомнянията и връзка с Вас. Можете да ги изтриете по всяко време от Моят профил → Изтрий данните ми.']]);
    const own = (cfg.texts.terms || '').trim();

  }
  const termsText = () => `Правила и условия — ${cfg.brand.name}\n` + termsParts().map(([h, l]) => `${h}\n${l.map((x) => '- ' + x).join('\n')}`).join('\n');
  const termsVer = () => { let h = 5381; const t = termsText(); for (let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) >>> 0; return h.toString(36); };
  const needTick = () => !me.token || me.termsV !== termsVer();
  function showTerms() {
    openPage(null, 'Правила и условия', `<p class="small muted" style="margin:0 0 4px">${esc(cfg.brand.name)}</p>
      ${termsParts().map(([h, l]) => `<h4>${esc(h)}</h4><ul>${l.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>`).join('')}`);
  }

  /* ── the profile menu (the button at the bottom right): my hours, my data, the studio (where, when), terms, help ── */
  const hoursTable = () => {
    const order = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'], names = { mon: 'Понеделник', tue: 'Вторник', wed: 'Сряда', thu: 'Четвъртък', fri: 'Петък', sat: 'Събота', sun: 'Неделя' };
    return `<table class="hrs">${order.map((d) => { const l = (cfg.hours && cfg.hours[d]) || []; return `<tr><td>${names[d]}</td><td>${l.length ? l.map((r) => `${r[0]}–${r[1]}`).join(', ') : 'почивен ден'}</td></tr>`; }).join('')}</table>`;
  };
  const mapLink = () => (cfg.mapUrl || (cfg.address ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(cfg.address) : ''));
  function openProfile() {
    if (!cfg) return;
    const ahead = mine.filter((h) => h.status === 'booked' && zonedMs(h.time.slice(0, 10), h.time.slice(11), tz()) > Date.now()).length;
    const el = sheet(`<h3>Моят профил</h3>
      <ul class="menu">
        <li><button data-p="mine">${ic('cal')}<span>Моите часове<small>${ahead ? ahead + ' предстоящи' : 'Няма предстоящи'}</small></span><span class="go">${ic('chev')}</span></button></li>
        ${window.Xems && Xems.on() ? Xems.menuItems() : ''}
        <li><button data-p="me">${ic('user')}<span>Моите данни<small>${me.name ? esc(me.name) : 'Още не сте записвали час'}</small></span><span class="go">${ic('chev')}</span></button></li>
        ${APP && nativeLN() ? `<li><button data-p="rem">${ic('bell')}<span>Напомняния<small>${[remPrefs().hours && 'Преди часа', remPrefs().weekly && 'Всяка неделя'].filter(Boolean).join(' · ') || 'Изключени'}</small></span><span class="go">${ic('chev')}</span></button></li>` : ''}
        <li><button data-p="studio">${ic('pin')}<span>Студиото<small>${cfg.address ? esc(cfg.address) : 'Адрес, телефон, работно време'}</small></span><span class="go">${ic('chev')}</span></button></li>
        <li><button data-p="terms">${ic('doc')}<span>Правила и условия</span><span class="go">${ic('chev')}</span></button></li>
        <li><a href="https://biocode.website/studio-support.html">${ic('help')}<span>Помощ и контакт</span><span class="go">${ic('chev')}</span></a></li>
        <li><a href="https://biocode.website/studio-privacy.html">${ic('shield')}<span>Поверителност</span><span class="go">${ic('chev')}</span></a></li>
        ${APP ? `<li><button data-p="switch">${ic('swap')}<span>Смени студио</span><span class="go">${ic('chev')}</span></button></li>` : ''}
      </ul><button class="btn sec" data-close>Затвори</button>`, (e) => {
      const b = e.target.closest('[data-p]');
      if (!b) return;
      const k = b.dataset.p;
      if (k.startsWith('xems-') && window.Xems) { Xems.open(k); return; }
      if (k === 'mine') openMine();
      else if (k === 'terms') { closeSheet(); showTerms(); }
      else if (k === 'switch') { $('switch').click(); }
      else if (k === 'studio') openStudioInfo();
      else if (k === 'me') openMyData();
      else if (k === 'rem') openReminders();
    });
    if (window.Xems && Xems.on()) {   // the card may have news: the menu updates itself once it is known
      const before = Xems.menuItems();
      Xems.refresh().then(() => { if (document.querySelector('.sheet .menu') && Xems.menuItems() !== before) openProfile(); });
    }
    return el;
  }
  function openStudioInfo(alone) {
    const map = mapLink();
    sheet(`<h3>${esc(cfg.brand.name)}</h3>
      ${cfg.address ? `<p style="margin:4px 0">${esc(cfg.address)}</p>` : ''}
      ${map ? `<a class="btn" href="${esc(map)}" target="_blank" rel="noopener">${ic('nav')}Навигация</a>` : ''}
      ${cfg.phone ? `<a class="btn sec" href="tel:${esc(cfg.phone.replace(/[^\d+]/g, ''))}">${ic('phone')}Обади се</a>` : ''}
      <b style="display:flex;align-items:center;gap:6px;margin-top:16px">${ic('clock')}Работно време</b>${hoursTable()}
      <p class="small muted">Час: ${cfg.slot.minutes} мин${cfg.price ? ' · ' + esc(money(cfg.price)) : ''}. Записване до ${cfg.rules.daysAhead} дни напред.</p>
      <button class="btn sec" ${alone ? 'data-close>Затвори' : 'data-back>Назад'}</button>`, (e) => { if (e.target.closest('[data-back]')) openProfile(); });
  }
  function openMyData() {
    sheet(`<h3>Моите данни</h3>
      <ul class="list"><li><span class="muted">Име</span><span>${esc(me.name || '—')}</span></li><li><span class="muted">Телефон</span><span>${esc(me.phone || '—')}</span></li>
      ${me.card ? `<li><span class="muted">Карта</span><span>${esc(cardName(me.card))}</span></li>` : ''}${codeOk(me.code) ? `<li><span class="muted">Код</span><span>${esc(me.code.code)}</span></li>` : ''}</ul>
      <p class="small muted">Данните се пазят на устройството и в студиото ${esc(cfg.brand.name)} — само за записванията Ви. Можете да ги изтриете по всяко време.</p>
      ${me.token ? `<button class="btn danger" data-go="forget">${ic('trash')}Изтрий данните ми</button>` : ''}
      <button class="btn sec" data-back>Назад</button>`, (e) => {
      if (e.target.closest('[data-back]')) { openProfile(); return; }
      if (e.target.closest('[data-go=forget]')) { closeSheet(); $('forget').click(); }
    });
  }
  $('fab').onclick = openProfile;


  /* every page a link leads to (rules, questions, effects, help, privacy, progress) opens INSIDE the app: a full-screen
     layer with "Close" — never a separate browser screen. Only a map (the phone's Maps app) and a phone call leave the app. */
  function openPage(url, title, html) {   // over everything (a sheet underneath stays as it was: closing returns to it)
    const el = document.createElement('div');
    el.className = 'viewer';
    el.innerHTML = `<div class="viewer-top"><button class="round" data-vx aria-label="Затвори">${ic('x')}</button><b>${esc(title || '')}</b><span class="round" style="visibility:hidden"></span></div>
      ${html ? `<div class="viewer-body">${html}</div>` : `<div class="viewer-load">${ic('doc')}<span>Зареждане…</span></div><iframe src="${esc(url)}" title="${esc(title || '')}"></iframe>`}`;
    if (html) el.classList.add('ready'); else el.querySelector('iframe').addEventListener('load', () => el.classList.add('ready'));
    el.querySelector('[data-vx]').onclick = () => { el.classList.add('out'); setTimeout(() => el.remove(), 220); };
    document.body.appendChild(el);
  }
  const leavesApp = (href) => /^(tel:|mailto:|sms:)/.test(href) || /google\.[a-z.]+\/maps|maps\.apple\.com|maps\.google|calendar\.google\.com/.test(href);
  document.addEventListener('click', (e) => {
    const a = e.target.closest && e.target.closest('a[href]');
    if (!a || a.closest('.adm') || a.hasAttribute('download')) return;
    const href = a.getAttribute('href') || '';
    if (!/^https?:\/\//.test(href) || leavesApp(href)) return;
    e.preventDefault();
    openPage(href, (a.dataset.title || a.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 40));
  }, true);


  /* ── "Предстоящ час": a full screen over the app, from the reminder (a tap on it, or when it arrives with the app open)
        and on every opening of the app in the hours before the training, until the client says "Ще дойда" ── */
  function upcomingHour(id) {
    const now = Date.now();
    const list = mine.filter((h) => h.status === 'booked').map((h) => ({ ...h, start: zonedMs(h.time.slice(0, 10), h.time.slice(11), tz()) }))
      .filter((h) => h.start > now - 15 * 60e3).sort((a, b) => a.start - b.start);
    return (id && list.find((h) => h.id === id)) || list[0] || null;
  }
  function untilText(ms) {
    const m = Math.max(0, Math.round(ms / 60e3));
    if (m < 1) return 'сега';
    if (m < 60) return `след ${m} мин`;
    const h = Math.floor(m / 60), r = m % 60;
    return h < 24 ? `след ${h} ч${r ? ` ${r} мин` : ''}` : `след ${Math.round(h / 24)} дни`;
  }
  let upTimer = null;
  function showUpcoming(id, force) {
    if (!cfg) return;
    const h = upcomingHour(id);
    if (!h) return;
    const acked = load('acked', []);
    if (!force && acked.includes(h.id)) return;
    document.querySelector('.upcoming') && document.querySelector('.upcoming').remove();
    const el = document.createElement('div');
    el.className = 'upcoming';
    const free = cfg.rules.freeCancelHours;
    const late = h.start - Date.now() < free * 3600e3;
    el.innerHTML = `<div class="up-inner">
      <div class="up-ring"><div class="logo" id="up-logo"></div></div>
      <p class="up-kicker">Твоята тренировка</p>
      <h2 class="up-when">${esc(dayLabel(h.time.slice(0, 10)))}</h2>
      <div class="up-time">${esc(h.time.slice(11))}</div>
      <p class="up-left" id="up-left">Очакваме те ${esc(untilText(h.start - Date.now()))}</p>
      <p class="up-where">${esc(cfg.brand.name)}${cfg.address ? `<br><span>${esc(cfg.address)}</span>` : ''}</p>
      <div class="up-prep"><span>${ic('drop')}Вода</span><span>${ic('user')}Удобни дрехи</span><span>${ic('clock')}Ела 5 мин по-рано</span></div>
      <div class="up-acts">
        <button class="btn up-ok" data-up="ok">${ic('check')}Ще дойда</button>
        ${mapLink() ? `<a class="btn sec" href="${esc(mapLink())}">${ic('nav')}Навигация</a>` : ''}
        ${late ? '' : `<button class="btn quiet" data-up="change">Промени или откажи</button>`}
      </div></div>`;
    brandLogo(el.querySelector('#up-logo'));
    el.addEventListener('click', (e) => {
      const b = e.target.closest('[data-up]');
      if (!b) return;
      if (!acked.includes(h.id)) { acked.push(h.id); save('acked', acked.slice(-50)); }
      close();
      if (b.dataset.up === 'change') openOwn(mine.find((x) => x.id === h.id));
      else haptic('ok');
    });
    const close = () => { clearInterval(upTimer); el.classList.add('out'); setTimeout(() => el.remove(), 240); };
    clearInterval(upTimer);
    upTimer = setInterval(() => { const t = el.querySelector('#up-left'); if (t) t.textContent = 'Очакваме те ' + untilText(h.start - Date.now()); }, 30e3);
    document.body.appendChild(el);
    haptic();
  }
  // on opening the app (and on coming back to it) in the hours before the training
  function upcomingOnOpen() {
    const h = upcomingHour();
    const ahead = Math.max(cfg && cfg.rules.reminderHours ? cfg.rules.reminderHours : 4, 3) * 3600e3;
    if (h && h.start - Date.now() <= ahead) showUpcoming(h.id, false);
  }

  /* ── my hours: list, cancel, move ── */
  async function refreshMine(askNotify) {
    if (!me.token || !me.phone) { renderMine(); return; }
    const r = await api('POST', 'mine', { phone: me.phone, token: me.token }).catch(() => null);
    if (r && r.status === 200) {
      mine = r.d.hours || [];
      me.card = r.d.card || null;
      me.code = r.d.code || null;
      if (r.d.name) me.name = r.d.name;
      save('me', me);
    } else if (r && r.status === 401) { me.token = ''; save('me', me); mine = []; }
    renderMine();
    if (r && r.status === 200) await syncReminders(askNotify === true);   // the phone's reminders follow the list
  }
  function renderMine() { renderMineList(); if (view) renderCal(); }   // the calendar's dots follow my hours
  function renderMineList() {
    const now = Date.now();
    const ahead = mine.filter((h) => h.status === 'booked' && zonedMs(h.time.slice(0, 10), h.time.slice(11), tz()) > now);
    $('mine-card').classList.toggle('hidden', !ahead.length && !me.token);
    $('old-client').parentNode.classList.toggle('hidden', Boolean(me.token) || !(cfg && cfg.viber));   // the login code comes by Viber
    $('mine-extra').textContent = [me.card ? cardName(me.card) : '', codeOk(me.code) ? me.code.code : ''].filter(Boolean).join(' · ');
    const sorted = ahead.slice().sort((a, b) => (a.time < b.time ? -1 : 1));
    const n = sorted[0];
    $('next-btn').classList.toggle('hidden', !n);
    if (n) {
      $('next-btn').innerHTML = `${ic('cal')}<span><small>Следващ час</small><strong>${esc(timeLabel(n.time))}</strong></span><span class="go">${ic('chev')}</span>`;
      $('next-btn').dataset.day = n.time.slice(0, 10);
    }
    const rel = (t) => { const d = Math.round((zonedMs(t.slice(0, 10), '12:00', tz()) - zonedMs(todayYmd(), '12:00', tz())) / 864e5); return d === 0 ? 'днес' : d === 1 ? 'утре' : `след ${d} дни`; };
    const MON = ['яну', 'фев', 'мар', 'апр', 'май', 'юни', 'юли', 'авг', 'сеп', 'окт', 'ное', 'дек'];
    $('mine').innerHTML = n ? `<li class="next" style="border-top:0"><div class="date"><i>${MON[+n.time.slice(5, 7) - 1]}</i><b>${+n.time.slice(8, 10)}</b></div>
        <div class="what"><b>${esc(n.time.slice(11))} · ${esc(rel(n.time))}</b><small>${esc(dayLabel(n.time.slice(0, 10)))}${n.late ? ' · под ' + cfg.rules.freeCancelHours + ' ч до часа' : ''}</small></div>
        <button class="btn mini sec" data-own="${esc(n.id)}">Промени</button></li>` +
      sorted.slice(1).map((h) => `<li><div class="when"><b>${esc(timeLabel(h.time))}</b>${h.late ? '<small>под ' + cfg.rules.freeCancelHours + ' ч до часа</small>' : ''}</div>
      <button class="btn mini sec" data-own="${esc(h.id)}">Промени</button></li>`).join('') : '<li class="muted small" style="border-top:0">Нямате предстоящи часове.</li>';
  }
  $('next-btn').onclick = async () => {   // as in XBody: the calendar goes to that day
    const k = $('next-btn').dataset.day;
    if (!k) return;
    const y = +k.slice(0, 4), m = +k.slice(5, 7) - 1;
    selDay = k;
    if (!view || view.y !== y || view.m !== m) await showMonth(y, m);
    selDay = k; renderCal();
    $('cal-card').scrollIntoView({ behavior: 'smooth' });
  };
  $('pills').onclick = (e) => { const b = e.target.closest('[data-pill]'); if (!b) return; if (b.dataset.pill === 'terms') showTerms(); else openStudioInfo(true); };

  /* pull down at the top = everything fresh (the hours, my hours) — as in XBody */
  (function pullToRefresh() {
    let y0 = null, pulled = 0, busyNow = false;
    const ptr = $('ptr');
    addEventListener('touchstart', (e) => { y0 = scrollY <= 0 && !back && e.touches.length === 1 ? e.touches[0].clientY : null; pulled = 0; }, { passive: true });
    addEventListener('touchmove', (e) => {
      if (y0 === null || busyNow) return;
      pulled = Math.max(0, e.touches[0].clientY - y0);
      ptr.style.opacity = Math.min(1, pulled / 80);
      ptr.style.transform = `translateY(${Math.min(pulled, 90) - 40}px) rotate(${pulled * 3}deg)`;
    }, { passive: true });
    addEventListener('touchend', async () => {
      if (y0 === null || busyNow) return;
      y0 = null;
      if (pulled < 80 || !cfg) { ptr.style.opacity = 0; ptr.style.transform = ''; return; }
      busyNow = true; ptr.style.transform = ''; ptr.classList.add('spin'); haptic();
      Object.keys(months).forEach((k) => { months[k].at = 0; });
      await Promise.all([refreshMine(), view ? ensureMonth(ymOf(view.y, view.m), true) : null]).catch(() => {});
      renderCal();
      ptr.classList.remove('spin'); ptr.style.opacity = 0; busyNow = false;
    });
  })();

  function openMine() {
    sheet(`<h3>Моите часове</h3><ul class="mine">${$('mine').innerHTML}</ul>${$('mine-extra').textContent ? `<p class="small muted">${esc($('mine-extra').textContent)}</p>` : ''}
      <button class="btn sec" data-close>Затвори</button>`, (e) => { const b = e.target.closest('[data-own]'); if (b) openOwn(mine.find((h) => h.id === b.dataset.own)); });
  }
  $('mine').onclick = (e) => { const b = e.target.closest('[data-own]'); if (b) openOwn(mine.find((h) => h.id === b.dataset.own)); };

  function openOwn(h) {
    if (!h) return;
    const late = h.late;
    const free = cfg.rules.freeCancelHours;
    sheet(`<h3>Вашият час</h3><p>${esc(timeLabel(h.time))}</p>
      ${late ? `<div class="alert">До часа остават по-малко от ${free} ч. Промяна вече не е възможна онлайн; при отказ часът се счита за проведен${cfg.card ? ' и се таксува автоматично от картата Ви' : ''}.</div>` : ''}
      ${late ? '' : '<button class="btn" data-go="move">Премести в друг час</button>'}
      ${APP ? '' : `<a class="btn sec" href="${esc(gcalLink(h.time))}" target="_blank" rel="noopener">Добави в календара</a>`}
      <button class="btn danger" data-go="cancel">Откажи часа</button>
      <button class="btn sec" data-close>Затвори</button>`, async (e) => {
      const go = e.target.closest('[data-go]');
      if (!go) return;
      if (go.dataset.go === 'move') {
        closeSheet();
        moving = { id: h.id, time: h.time };
        renderSlots();
        $('move-banner').innerHTML = `Изберете нов час за <b>${esc(timeLabel(h.time))}</b> · <button class="link" id="move-x">откажи</button>`;
        $('move-banner').classList.remove('hidden');
        $('move-x').onclick = () => { moving = null; $('move-banner').classList.add('hidden'); renderBar(); renderSlots(); };
        renderBar();
        $('cal-card').scrollIntoView({ behavior: 'smooth' });
        return;
      }
      if (go.dataset.go === 'cancel') {
        if (!go.dataset.sure) { go.dataset.sure = '1'; go.textContent = late ? 'Да, откажи (без възстановяване)' : 'Да, откажи часа'; return; }
        busy(go, 'Отказване…');
        const r = await api('POST', 'cancel', { phone: me.phone, token: me.token, id: h.id }).catch(() => ({ status: 0 }));
        if (r.status !== 200) { unbusy(go); toast(r.status === 0 ? 'Няма връзка.' : 'Отказът не успя.'); return; }
        closeSheet();
        toast('Часът е отказан');
        Object.keys(months).forEach((k) => { months[k].at = 0; });
        await Promise.all([refreshMine(), ensureMonth(ymOf(view.y, view.m), true)]);
        renderCal();
      }
    });
  }
  function confirmMove(t) {
    const h = moving;
    sheet(`<h3>Преместване</h3><ul class="list"><li><span class="muted">от</span><span>${esc(timeLabel(h.time))}</span></li><li><span class="muted">на</span><b>${esc(timeLabel(t))}</b></li></ul>
      <p class="err" id="m-err"></p><button class="btn" data-go="ok">Премести</button><button class="btn sec" data-close>Назад</button>`, async (e) => {
      const go = e.target.closest('[data-go]');
      if (!go) return;
      busy(go, 'Преместване…');
      const r = await api('POST', 'move', { phone: me.phone, token: me.token, id: h.id, time: t }).catch(() => ({ status: 0, d: {} }));
      if (r.status !== 200) {
        unbusy(go);
        $('m-err').textContent = { taken: 'Часът току-що беше зает.', too_late: 'Вече е късно за промяна онлайн.', calendar: 'Календарът не отговаря — след малко.' }[r.d.error] || 'Не успя.';
        return;
      }
      moving = null;
      $('move-banner').classList.add('hidden');
      closeSheet();
      toast('Часът е преместен');
      Object.keys(months).forEach((k) => { months[k].at = 0; });
      await Promise.all([refreshMine(), ensureMonth(ymOf(view.y, view.m), true)]);
      renderCal();
      renderBar();
    });
  }

  /* ── delete my data (this studio): hours ahead released, the records no longer say who it was ── */
  $('forget').onclick = () => {
    sheet(`<h3>Изтриване на данните</h3><p class="small">Ще бъдат изтрити името, телефонът и запазената карта от <b>${esc(cfg.brand.name)}</b>, а предстоящите Ви часове ще бъдат освободени. Това не може да се върне.</p>
      <p class="err" id="f-err"></p><button class="btn danger" data-go="yes">Да, изтрий</button><button class="btn sec" data-close>Не</button>`, async (e) => {
      const go = e.target.closest('[data-go]');
      if (!go) return;
      busy(go, 'Изтриване…');
      const r = await api('POST', 'forget', { phone: me.phone, token: me.token }).catch(() => ({ status: 0 }));
      if (r.status !== 200) { unbusy(go); $('f-err').textContent = r.status === 0 ? 'Няма връзка.' : 'Не успя. Опитайте отново.'; return; }
      await dropReminders(); save('pushTok', '');
      if (window.Xems) Xems.forget();
      try { Object.keys(localStorage).filter((k) => k.startsWith(`st:${STUDIO}:`)).forEach((k) => localStorage.removeItem(k)); } catch (_) {}
      closeSheet();
      toast('Данните са изтрити');
      setTimeout(() => location.reload(), 900);
    });
  };

  /* ── a new phone: the Viber code ── */
  $('old-client').onclick = () => {
    sheet(`<h3>Вход с телефон</h3><p class="small muted">Ще получите 4-цифрен код по Viber (до 2–3 минути).</p>
      <label class="f">Телефон<input id="v-phone" type="tel" value="${esc(me.phone || '')}" placeholder="0888 123 456"></label>
      <div id="v-step2" class="hidden"><label class="f">Кодът от Viber<input id="v-pin" inputmode="numeric" maxlength="4" autocomplete="one-time-code"></label></div>
      <p class="err" id="v-err"></p><button class="btn" data-go="send">Изпрати код</button><button class="btn sec" data-close>Затвори</button>`, async (e) => {
      const go = e.target.closest('[data-go]');
      if (!go) return;
      const phone = $('v-phone').value.trim();
      if (go.dataset.go === 'send') {
        busy(go, '…');
        const r = await api('POST', 'verify/start', { phone }).catch(() => ({ status: 0 }));
        unbusy(go);
        if (r.status !== 200) { $('v-err').textContent = r.status === 429 ? 'Изчакайте минута и опитайте пак.' : 'Проверете телефона.'; return; }
        $('v-step2').classList.remove('hidden');
        go.dataset.go = 'check';
        go.textContent = 'Влез';
        $('v-err').textContent = 'Ако сте записвали час с този телефон, кодът идва по Viber.';
        $('v-pin').focus();
        return;
      }
      busy(go, '…');
      const r = await api('POST', 'verify/finish', { phone, pin: $('v-pin').value.trim() }).catch(() => ({ status: 0 }));
      unbusy(go);
      if (r.status !== 200) { $('v-err').textContent = 'Грешен или изтекъл код.'; return; }
      me = { ...me, phone, token: r.d.token };
      save('me', me);
      closeSheet();
      await refreshMine();
      renderCal();
      toast('Влязохте');
    });
  };

  /* ══════════ ADMIN (7 taps on the logo → the 5-digit code) ══════════ */
  let taps = [];
  $('logo').addEventListener('click', () => {
    if (APP) return;   // the store app has no hidden features (App Store 2.3.1): the admin is only on the studio's web address
    const now = Date.now();
    taps = taps.filter((t) => now - t < 3000).concat(now);
    if (taps.length >= 7) { taps = []; openAdmin(); }
  });
  const AK = () => `st:${STUDIO}:admin`;
  let adm = null;   // { token, state, bookings, clients, tab, day }
  function admToken() { try { const v = JSON.parse(sessionStorage.getItem(AK()) || 'null'); return v && v.expires > Date.now() ? v.token : ''; } catch (_) { return ''; } }
  const aapi = (method, path, body) => api(method, path, body, { Authorization: `Bearer ${adm.token}` });

  function openAdmin() {
    const token = admToken();
    if (token) { startAdmin(token); return; }
    const el = sheet(`<h3>Вход за студиото</h3><p class="small muted">5-цифреният код на студиото.</p>
      <div class="pin">${[0, 1, 2, 3, 4].map((i) => `<input inputmode="numeric" maxlength="1" data-i="${i}" aria-label="цифра ${i + 1}">`).join('')}</div>
      <p class="err" id="p-err"></p><button class="btn sec" data-close>Затвори</button>`);
    const boxes = [...el.querySelectorAll('.pin input')];
    boxes[0].focus();
    const tryIt = async () => {
      const pin = boxes.map((b) => b.value).join('');
      if (!/^\d{5}$/.test(pin)) return;
      boxes.forEach((b) => { b.disabled = true; });
      const r = await api('POST', 'admin/login', { pin }).catch(() => ({ status: 0 }));
      if (r.status === 200) {
        try { sessionStorage.setItem(AK(), JSON.stringify(r.d)); } catch (_) {}
        closeSheet();
        startAdmin(r.d.token);
        return;
      }
      boxes.forEach((b) => { b.disabled = false; b.value = ''; });
      boxes[0].focus();
      $('p-err').textContent = r.status === 429 ? 'Твърде много грешни опити — заключено за 15 минути.' : r.status === 0 ? 'Няма връзка.' : 'Грешен код.';
    };
    boxes.forEach((b, i) => {
      b.addEventListener('input', () => { b.value = b.value.replace(/\D/g, '').slice(-1); if (b.value && boxes[i + 1]) boxes[i + 1].focus(); tryIt(); });
      b.addEventListener('keydown', (e) => { if (e.key === 'Backspace' && !b.value && boxes[i - 1]) boxes[i - 1].focus(); });
      b.addEventListener('paste', (e) => {
        const d = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 5);
        if (d.length === 5) { e.preventDefault(); d.split('').forEach((c, j) => { boxes[j].value = c; }); tryIt(); }
      });
    });
  }

  async function startAdmin(token) {
    adm = { token, tab: 'today', day: todayYmd(), bookings: [], clients: null, state: null };
    let root = $('adm');
    if (!root) {
      root = document.createElement('div');
      root.id = 'adm';
      root.className = 'adm';
      document.body.appendChild(root);
    }
    root.innerHTML = `<div class="adm-top"><div class="wrap"><div class="logo" style="width:36px;height:36px;border-radius:10px;font-size:16px" id="a-logo"></div>
      <h2>${esc(cfg.brand.name)} · admin</h2><button class="btn mini sec" id="a-out">Изход</button></div></div>
      <div class="wrap" id="a-body"><p class="muted">Зареждане…</p></div>
      <nav class="tabs"><button data-tab="today"><b>📅</b>График</button><button data-tab="clients"><b>👥</b>Клиенти</button>
      <button data-tab="codes"><b>🎟</b>Кодове</button><button data-tab="settings"><b>⚙️</b>Настройки</button></nav>`;
    brandLogo($('a-logo'));
    root.classList.remove('hidden');
    document.body.style.overflow = 'hidden';
    $('a-out').onclick = closeAdmin;
    root.querySelector('.tabs').onclick = (e) => { const b = e.target.closest('[data-tab]'); if (b) { adm.tab = b.dataset.tab; renderAdmin(); } };
    const [st] = await Promise.all([aapi('GET', 'admin/state'), loadBookings()]);
    if (st.status === 401) { try { sessionStorage.removeItem(AK()); } catch (_) {} closeAdmin(); openAdmin(); return; }
    adm.state = st.d;
    renderAdmin();
  }
  function closeAdmin() {
    const root = $('adm');
    if (root) root.classList.add('hidden');
    document.body.style.overflow = '';
    adm = null;
    loadConfig().then(() => { Object.keys(months).forEach((k) => { months[k].at = 0; }); showMonth(view.y, view.m); });
  }
  async function loadBookings() {
    const r = await aapi('GET', `admin/bookings?from=${Date.now() - 31 * 864e5}&to=${Date.now() + 120 * 864e5}`);
    if (r.status === 200) adm.bookings = r.d.bookings || [];
  }
  function renderAdmin() {
    if (!adm) return;
    $('adm').querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === adm.tab));
    ({ today: admToday, clients: admClients, codes: admCodes, settings: admSettings })[adm.tab]();
  }

  /* — the schedule: today first, the next 2 weeks, actions on each hour — */
  function bkDay(b) { return zonedParts(b.start_ms, tz()).ymd; }
  function admToday() {
    const now = Date.now();
    const list = adm.bookings;
    const live = list.filter((b) => b.status === 'booked');
    const week = live.filter((b) => b.start_ms >= now && b.start_ms < now + 7 * 864e5).length;
    const today = live.filter((b) => bkDay(b) === todayYmd()).length;
    const missed = list.filter((b) => (b.status === 'noshow' || b.late_cancel) && b.start_ms > now - 30 * 864e5).length;
    const days = [];
    for (let i = -1; i < 14; i++) {
      const ymd = zonedParts(now + i * 864e5, tz()).ymd;
      days.push({ ymd, n: live.filter((b) => bkDay(b) === ymd).length });
    }
    const closed = (adm.state.settings.closed || []).includes(adm.day);
    const dayList = list.filter((b) => bkDay(b) === adm.day).sort((a, b) => a.start_ms - b.start_ms);
    $('a-body').innerHTML = `<div class="stats"><div class="stat"><b>${today}</b><span>днес</span></div><div class="stat"><b>${week}</b><span>7 дни</span></div>
      <div class="stat"><b>${missed}</b><span>неявявания</span></div></div>
      ${adm.state.google.calendarError && adm.state.google.calendarError !== 'none' ? '<div class="alert">Google Calendar не е свързан правилно — виж Настройки → Google Calendar.</div>' : ''}
      <div class="days">${days.map((d) => `<button data-day="${d.ymd}" class="${d.ymd === adm.day ? 'on' : ''}"><i>${WD[new Date(d.ymd + 'T12:00:00Z').getUTCDay()]}</i><b>${+d.ymd.slice(8)}</b><i>${d.n ? d.n + ' ч.' : '—'}</i></button>`).join('')}</div>
      <div class="card"><div class="row" style="justify-content:space-between"><b>${esc(dayLabel(adm.day))}</b>
      <button class="btn mini sec" data-a="refresh" style="flex:none" aria-label="Обнови">↻</button></div>
      ${closed ? '<div class="alert">Почивен ден — не се предлагат часове.</div>' : ''}
      <div>${dayList.length ? dayList.map(bkRow).join('') : '<p class="empty">Няма записани часове.</p>'}</div>
      <button class="btn" data-a="add">＋ Запиши клиент</button>
      <button class="btn sec" data-a="close-day">${closed ? 'Отвори деня отново' : 'Затвори деня (почивка)'}</button></div>`;
    $('a-body').onclick = todayClick;
  }
  function bkRow(b) {
    const p = zonedParts(b.start_ms, tz());
    const past = b.start_ms < Date.now();
    const st = b.status === 'canceled' ? `<span class="chip bad">отказан${b.late_cancel ? ' късно' : ''}</span>` : b.status === 'noshow' ? '<span class="chip bad">не дойде</span>' : past ? '<span class="chip ok">проведен</span>' : '';
    const tags = [b.code ? `<span class="chip">🎟 ${esc(b.code)}</span>` : '', b.card_last4 ? `<span class="chip">💳 ${esc(b.card_last4)}</span>` : '', b.source === 'admin' ? '<span class="chip">ръчно</span>' : ''].join(' ');
    const phone = esc(b.phone);
    const chargeable = b.card_pm && (b.status === 'noshow' || (b.status === 'canceled' && b.late_cancel));
    return `<div class="bk${b.status === 'canceled' ? ' off' : ''}"><div class="t">${p.hm}</div><div class="who"><b>${esc(b.name || '—')}</b> ${st}<br>
      <a href="tel:${phone}">${phone}</a> · <a href="viber://chat?number=${encodeURIComponent(b.phone)}">Viber</a><div class="small">${tags}</div>
      <div class="acts">${b.status === 'booked' && past ? `<button class="btn mini sec" data-b="noshow" data-id="${b.id}">Не дойде</button>` : ''}
      ${b.status === 'booked' && !past ? `<button class="btn mini sec" data-b="cancel" data-id="${b.id}">Откажи</button>` : ''}
      ${b.status === 'noshow' ? `<button class="btn mini sec" data-b="restore" data-id="${b.id}">Дойде</button>` : ''}
      ${chargeable ? `<button class="btn mini" data-b="charge" data-id="${b.id}">Таксувай</button>` : ''}</div></div></div>`;
  }
  async function todayClick(e) {
    const d = e.target.closest('[data-day]');
    if (d) { adm.day = d.dataset.day; admToday(); return; }
    const a = e.target.closest('[data-a]');
    const bt = e.target.closest('[data-b]');
    if (a && a.dataset.a === 'refresh') { await loadBookings(); admToday(); toast('Обновено'); return; }
    if (a && a.dataset.a === 'add') { admAdd(); return; }
    if (a && a.dataset.a === 'close-day') {
      const st = adm.state.settings;
      const set = new Set(st.closed || []);
      if (set.has(adm.day)) set.delete(adm.day); else set.add(adm.day);
      const r = await aapi('POST', 'admin/settings', { settings: { ...st, closed: [...set].sort() } });
      if (r.status === 200) { adm.state.settings = r.d.settings; admToday(); toast(set.has(adm.day) ? 'Денят е затворен' : 'Денят е отворен'); }
      return;
    }
    if (!bt) return;
    const b = adm.bookings.find((x) => x.id === bt.dataset.id);
    if (bt.dataset.b === 'charge') {
      const amount = prompt('Сума за таксуване (' + (cfg.currency || 'EUR') + ')', String(cfg.price || ''));
      if (!amount) return;
      busy(bt, '…');
      const r = await aapi('POST', 'admin/charge', { id: b.id, amount: Number(String(amount).replace(',', '.')) });
      unbusy(bt);
      toast(r.d.ok ? 'Таксувано ✓' : r.d.status === 'requires_action' ? 'Банката иска потвърждение от клиента — таксувай от Stripe.' : 'Таксуването не мина: ' + (r.d.detail || r.d.error || ''), 5000);
      return;
    }
    if (bt.dataset.b === 'cancel' && !confirm('Да откажа ли часа? Клиентът получава съобщение по Viber.')) return;
    busy(bt, '…');
    const r = await aapi('POST', 'admin/booking', { id: b.id, action: bt.dataset.b });
    if (r.status === 200) { await loadBookings(); admToday(); } else { unbusy(bt); toast('Не успя'); }
  }
  async function admAdd() {
    const day = adm.day;
    const m = await ensureMonth(day.slice(0, 7), true);
    const free = (m.days[day] || []);
    sheet(`<h3>Запиши клиент</h3><p class="small muted">${esc(dayLabel(day))}</p>
      <label class="f">Час${free.length ? '' : ' (в графика няма свободен — въведи час)'}<select id="n-time">${free.map((t) => `<option>${t}</option>`).join('')}<option value="">друг час…</option></select></label>
      <label class="f hidden" id="n-other">Час (ЧЧ:ММ)<input id="n-hm" type="time" step="300"></label>
      <label class="f">Име<input id="n-name"></label><label class="f">Телефон<input id="n-phone" type="tel" placeholder="0888 123 456"></label>
      <label class="tick"><input type="checkbox" id="n-viber" checked><span>Прати потвърждение и напомняне по Viber</span></label>
      <p class="err" id="n-err"></p><button class="btn" data-go="save">Запиши</button><button class="btn sec" data-close>Затвори</button>`, async (e) => {
      if (!e.target.closest('[data-go]')) return;
      const t = $('n-time').value || $('n-hm').value;
      const r = await aapi('POST', 'admin/book', { time: `${day} ${t}`, name: $('n-name').value, phone: $('n-phone').value, viber: $('n-viber').checked });
      if (r.status !== 200) { $('n-err').textContent = r.d.error === 'taken' ? 'Часът се застъпва с друг.' : r.d.error === 'past' ? 'Часът вече е минал.' : 'Проверете часа, името и телефона.'; return; }
      closeSheet();
      await loadBookings();
      admToday();
      toast('Записан ✓');
    });
    $('n-time').onchange = () => $('n-other').classList.toggle('hidden', $('n-time').value !== '');
    if (!free.length) $('n-other').classList.remove('hidden');
  }

  /* — clients: search, call, Viber — */
  async function admClients() {
    if (!adm.clients) {
      $('a-body').innerHTML = '<p class="muted">Зареждане…</p>';
      const r = await aapi('GET', 'admin/clients');
      adm.clients = (r.d && r.d.clients) || [];
    }
    $('a-body').innerHTML = `<label class="f"><input id="c-q" placeholder="Търси по име или телефон" autocomplete="off"></label><div class="card" id="c-list"></div>
      <p class="small muted">Общо: ${adm.clients.length}</p>`;

      const q = $('c-q').value.trim().toLowerCase();

      $('c-list').innerHTML = list.slice(0, 200).map((c) => `<div class="bk"><div class="who"><b>${esc(c.name || '—')}</b>
        ${c.missed ? `<span class="chip bad">${c.missed} неявяв.</span>` : ''}<br><a href="tel:${esc(c.phone)}">${esc(c.phone)}</a> · <a href="viber://chat?number=${encodeURIComponent(c.phone)}">Viber</a>
        <div class="small muted">${c.done} проведени · ${c.ahead} предстоящи${c.card_last4 ? ' · 💳 ' + esc(c.card_last4) : ''}${c.code ? ' · 🎟 ' + esc(c.code) : ''}</div></div></div>`).join('') || '<p class="empty">Няма клиенти.</p>';
    };
    $('c-q').oninput = draw;
    draw();
  }

  /* — codes — */
  function admCodes() {
    const codes = adm.state.codes || [];
    const now = Date.now();
    $('a-body').innerHTML = `<button class="btn" id="k-new">＋ Нов код</button><div class="card">${codes.length ? codes.map((c) => {
      const dead = !c.active || (c.valid_to && c.valid_to < now) || c.uses_left === 0;
      return `<div class="bk${dead ? ' off' : ''}"><div class="who"><b>${esc(c.code)}</b> ${c.label ? esc(c.label) : ''} ${dead ? '<span class="chip bad">неактивен</span>' : '<span class="chip ok">активен</span>'}
        <div class="small muted">${c.uses_left == null ? 'без лимит' : 'остават ' + c.uses_left}${c.per_client != null ? ' · до ' + c.per_client + ' на клиент' : ''}${c.valid_to ? ' · до ' + endDate(c.valid_to) : ''}</div>
        <div class="acts"><button class="btn mini sec" data-k="${esc(c.code)}">Промени</button></div></div></div>`;
    }).join('') : '<p class="empty">Няма кодове. С код клиентът записва без карта (ако гаранцията е „карта или код“).</p>'}</div>`;
    $('k-new').onclick = () => codeSheet(null);
    $('a-body').querySelectorAll('[data-k]').forEach((b) => { b.onclick = () => codeSheet(codes.find((c) => c.code === b.dataset.k)); });

  function codeSheet(c) {
    const rand = () => Array.from(crypto.getRandomValues(new Uint8Array(6)), (x) => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[x % 32]).join('');
    const vt = c && c.valid_to ? new Date(c.valid_to).toISOString().slice(0, 10) : '';
    sheet(`<h3>${c ? 'Код ' + esc(c.code) : 'Нов код'}</h3>
      ${c ? '' : `<div class="row"><label class="f">Код<input id="k-code" value="${rand()}" autocapitalize="characters"></label><button class="btn mini sec" id="k-rand" style="flex:none;margin-top:28px">🎲</button></div>`}
      <label class="f">Описание (вижда се от клиента)<input id="k-label" value="${esc(c ? c.label : '')}" placeholder="напр. Пакет 10 тренировки"></label>
      <div class="row"><label class="f">Общо ползвания<input id="k-uses" type="number" min="0" value="${c && c.uses_left != null ? c.uses_left : ''}" placeholder="без лимит"></label>
      <label class="f">На клиент<input id="k-per" type="number" min="0" value="${c && c.per_client != null ? c.per_client : ''}" placeholder="без лимит"></label></div>
      <label class="f">Важи до<input id="k-to" type="date" value="${vt}"></label>
      <label class="tick"><input type="checkbox" id="k-on" ${!c || c.active ? 'checked' : ''}><span>Активен</span></label>
      <p class="small muted">Пакет за един човек: „на клиент“ = броя тренировки. Общ промокод: остави „на клиент“ 1.</p>
      <button class="btn" data-go="save">Запази</button><button class="btn sec" data-close>Затвори</button>`, async (e) => {
      if (e.target.id === 'k-rand') { $('k-code').value = rand(); return; }
      if (!e.target.closest('[data-go]')) return;
      const to = $('k-to').value;
      const r = await aapi('POST', 'admin/code', { code: c ? c.code : $('k-code').value.trim(), label: $('k-label').value, usesLeft: $('k-uses').value, perClient: $('k-per').value,
        validTo: to ? zonedMs(to, '23:59', tz()) : null, active: $('k-on').checked });

      toast('Запазено ✓');

  }

  /* — settings: the most used first; one Save — */

        <div class="row">${f('r-free', 'Безплатен отказ до (ч преди часа)', s.rules.freeCancelHours, 'number', 'min=0 max=168')}${f('r-rem', 'Напомняне на телефона преди часа (ч, 0 = без)', s.rules.reminderHours, 'number', 'min=0 max=48')}</div>
        <p class="small muted">Напомнянето е известие, което приложението само слага на телефона на клиента — без интернет в момента и без разход.</p>

    };

    $('c-add').onclick = async () => { const d = $('c-day').value; if (!d) return; await saveSettings({ closed: [...new Set([...(s.closed || []), d])].sort() }); admSettings(); };

    $('b-logo').onchange = uploadLogo;
    const copyText = (t) => { try { navigator.clipboard.writeText(t); toast('Копирано'); } catch (_) { toast('Копирай ръчно'); } };
    $('inv-copy-link').onclick = () => copyText($('inv-link').textContent);
    $('inv-copy-msg').onclick = () => copyText($('inv-msg').value);
    $('inv-qr-btn').onclick = () => {   // the QR of the link (the library is loaded only now)
      const draw = () => { $('inv-qr').innerHTML = ''; new window.QRCode($('inv-qr'), { text: $('inv-link').textContent, width: 220, height: 220 }); };

      sc.onerror = () => toast('QR кодът не се зареди — ползвай връзката.');

    $('nt-send').onclick = async () => {
