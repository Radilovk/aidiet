name: Classify exercises (EFP v3, deterministic)

# EFP v3 = правилата в fitness/exercise-classifier.js (без AI). Ръчните корекции
# (manual/manualEdit) в fitness/data/exercise-metadata.json се запазват.
# Старата AI класификация (EFP v2, fitness/scripts/classify-exercises.mjs) не се ползва —
# тя презаписваше детерминистичните данни с непоследователни оценки.

on:
  workflow_dispatch:

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rule-based classify exercises
        run: node fitness/scripts/rule-classify-exercises.mjs
      - name: Commit metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fitness/data/exercise-metadata.json
          git diff --staged --quiet || git commit -m "chore(fitness): update EFP v3 metadata (rule-based)"
          git push
