name: Wording — автоматично прилагане

# Редакциите от лендингите (wording-editor.js → KV wording:*) влизат сами в main:
# снимките (WebP, ред, кадър, ефект), текстът (с лека проверка на правописа) и преводите на всички езици.
# Тръгва веднага при „Запази“ (worker → repository_dispatch) и на всеки 20 мин като резерва.
# Каквото не може да се приложи само (напр. текст през няколко елемента, бележка) остава в KV за ръчно.
# Скорост: KV се чете директно през API-то на Cloudflare (не през wrangler), sharp се слага само при снимки,
# Gemini работи паралелно; публикуването е само сглобяването на Pages от клона (legacy), без второ публикуване.
on:
  repository_dispatch:
    types: [wording-saved]
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

concurrency:
  group: wording-apply
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      KV: https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/storage/kv/namespaces/81fc0991b2764918b682f9ca170abd4b
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      REPO_KIND: aidiet
    steps:
      - name: Записи от KV
        id: rec
        run: |
          T="$RUNNER_TEMP"; mkdir -p "$T/img"
          kv() { curl -sf -H "Authorization: Bearer $CF_TOKEN" "$KV/$1"; }
          kv "keys?prefix=wording%3A" | jq -r '.result[].name' > "$T/keys.txt"
          n=$(grep -c . "$T/keys.txt" || true); echo "n=$n" >> "$GITHUB_OUTPUT"
          [ "$n" = 0 ] && { echo "Няма нови редакции."; exit 0; }
          export -f kv; export T
          # стойностите — паралелно
          cat "$T/keys.txt" | xargs -P 8 -I{} bash -c 'kv "values/$(jq -rn --arg k "{}" "\$k|@uri")" > "$T/rec-$(echo {} | tr ":" "-").json"'
          jq -s '.' "$T"/rec-*.json > "$T/recs.json"
          jq -r '.[].slots[]?.items[]?.key // empty' "$T/recs.json" > "$T/imgkeys.txt"
          echo "img=$(grep -c . "$T/imgkeys.txt" || true)" >> "$GITHUB_OUTPUT"
          cat "$T/imgkeys.txt" | xargs -P 8 -I{} bash -c 'kv "values/$(jq -rn --arg k "{}" "\$k|@uri")" > "$T/img/$(echo {} | sed "s/^wording-img://; s/:/-/g").b64"'
          for f in "$T"/img/*.b64; do
            [ -e "$f" ] || continue
            node -e '
              const fs=require("fs"); const f=process.argv[1]; const d=fs.readFileSync(f,"utf8").trim();
              const m=/^data:image\/(\w+);base64,(.*)$/s.exec(d); fs.unlinkSync(f); if(!m) process.exit(0);
              fs.writeFileSync(f.replace(/\.b64$/,"."+(m[1]==="jpeg"?"jpg":m[1])), Buffer.from(m[2],"base64"));' "$f"
          done
          echo "Записи: $n, снимки: $(ls "$T/img" | wc -l)"

      - uses: actions/checkout@v4
        if: steps.rec.outputs.n != '0'
        with: { ref: main }

      - uses: actions/setup-node@v4
        if: steps.rec.outputs.n != '0'
        with: { node-version: '22' }

      - name: Прилагане
        if: steps.rec.outputs.n != '0'
        run: |
          if [ "${{ steps.rec.outputs.img }}" != "0" ]; then
            npm i --prefix "$RUNNER_TEMP/sh" --no-save --no-package-lock --no-audit --no-fund sharp@0.34.4 >/dev/null
            ln -s "$RUNNER_TEMP/sh/node_modules" node_modules
          fi
          node scripts/wording-apply.mjs --repo "$REPO_KIND" --records "$RUNNER_TEMP/recs.json" --imgdir "$RUNNER_TEMP/img" --applied "$RUNNER_TEMP/applied.txt"
          rm -f node_modules
          { echo '### Редакции'; echo '```'; cat "$RUNNER_TEMP/wording-apply.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Проверка на преводите
        if: steps.rec.outputs.n != '0'
        run: node scripts/test-i18n.mjs

      - name: Запис в main (сайтът се сглобява сам от клона)
        if: steps.rec.outputs.n != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A brand/photos i18n *.html
          if git diff --cached --quiet; then echo "Няма промени в кода."; exit 0; fi
          # нов кеш на service worker-а, за да видят приложението и сайта новото веднага
          v=$(grep -oP "nutriplan-v\K[0-9]+" sw.js | head -1); nv=$((v + 1))
          sed -i "s/nutriplan-v$v'/nutriplan-v$nv'/" sw.js && git add sw.js
          git commit -q -m "wording: автоматично — редакциите от лендингите"
          for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep $((i * 5)); done

      - name: Изтриване на приложените от KV
        if: steps.rec.outputs.n != '0'
        run: |
          [ -s "$RUNNER_TEMP/applied.txt" ] || exit 0
          keys=$(jq -R -s --slurpfile r "$RUNNER_TEMP/recs.json" '
            (split("\n") | map(select(length > 0))) as $ids
            | [ $ids[] | "wording:" + . ]
              + [ $r[0][] | select(.id as $i | $ids | index($i)) | .slots[]?.items[]?.key // empty ]' "$RUNNER_TEMP/applied.txt")
          echo "$keys" | jq -r '.[]'
          curl -sf -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" "$KV/bulk/delete" -d "$keys" | jq -c '{success}' \
            || curl -sf -X DELETE -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" "$KV/bulk" -d "$keys" | jq -c '{success}'
