name: Wording — автоматично прилагане

# Редакциите от лендингите (wording-editor.js → KV wording:*) влизат сами в main:
# снимките (WebP, ред, кадър, ефект), текстът (с лека проверка на правописа) и преводите на всички езици.
# Тръгва веднага при „Запази“ (worker → repository_dispatch) и на всеки 20 мин като резерва.
# Каквото не може да се приложи само (напр. текст през няколко елемента, бележка) остава в KV за ръчно.
on:
  repository_dispatch:
    types: [wording-saved]
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

concurrency:
  group: wording-apply
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NS: 81fc0991b2764918b682f9ca170abd4b
      REPO_KIND: aidiet
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Записи от KV
        id: rec
        run: |
          T="$RUNNER_TEMP"; mkdir -p "$T/img"
          npx -y wrangler@4 kv key list --namespace-id="$NS" --remote --prefix "wording:" > "$T/keys.json"
          n=$(jq length "$T/keys.json"); echo "n=$n" >> "$GITHUB_OUTPUT"
          [ "$n" = 0 ] && { echo "Няма нови редакции."; exit 0; }
          echo '[' > "$T/recs.json"; first=1
          for k in $(jq -r '.[].name' "$T/keys.json"); do
            v=$(npx -y wrangler@4 kv key get --namespace-id="$NS" --remote "$k" 2>/dev/null) || continue
            [ $first = 1 ] || echo ',' >> "$T/recs.json"; first=0
            echo "$v" >> "$T/recs.json"
          done
          echo ']' >> "$T/recs.json"
          for k in $(jq -r '.[].slots[]?.items[]?.key // empty' "$T/recs.json"); do
            npx -y wrangler@4 kv key get --namespace-id="$NS" --remote "$k" > "$T/one.txt" 2>/dev/null || continue
            node -e '
              const fs=require("fs"); const d=fs.readFileSync(process.argv[2],"utf8").trim();
              const m=/^data:image\/(\w+);base64,(.*)$/s.exec(d); if(!m) process.exit(0);
              fs.writeFileSync(process.argv[3]+"/"+process.argv[1].replace(/^wording-img:/,"").replace(/:/g,"-")+"."+(m[1]==="jpeg"?"jpg":m[1]), Buffer.from(m[2],"base64"));' "$k" "$T/one.txt" "$T/img"
          done
          echo "Записи: $n, снимки: $(ls "$T/img" | wc -l)"

      - name: Прилагане
        if: steps.rec.outputs.n != '0'
        run: |
          npm i --prefix "$RUNNER_TEMP/sh" --no-save --no-package-lock sharp@0.34.4 >/dev/null
          [ -e node_modules ] || ln -s "$RUNNER_TEMP/sh/node_modules" node_modules
          node scripts/wording-apply.mjs --repo "$REPO_KIND" --records "$RUNNER_TEMP/recs.json" --imgdir "$RUNNER_TEMP/img" --applied "$RUNNER_TEMP/applied.txt"
          rm -f node_modules
          { echo '### Редакции'; echo '```'; cat "$RUNNER_TEMP/wording-apply.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Проверка на преводите
        if: steps.rec.outputs.n != '0'
        run: node scripts/test-i18n.mjs

      - name: Запис в main и публикуване
        if: steps.rec.outputs.n != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A brand/photos i18n *.html
          if git diff --cached --quiet; then echo "Няма промени в кода."; exit 0; fi
          # нов кеш на service worker-а, за да видят приложението и сайта новото веднага
          v=$(grep -oP "nutriplan-v\K[0-9]+" sw.js | head -1); nv=$((v + 1))
          sed -i "s/nutriplan-v$v'/nutriplan-v$nv'/" sw.js && git add sw.js
          git commit -q -m "wording: автоматично — редакциите от лендингите"
          for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep $((i * 5)); done
          gh workflow run deploy-pages.yml --ref main

      - name: Изтриване на приложените от KV
        if: steps.rec.outputs.n != '0'
        run: |
          [ -s "$RUNNER_TEMP/applied.txt" ] || exit 0
          while read -r id; do
            [ -n "$id" ] || continue
            npx -y wrangler@4 kv key delete --namespace-id="$NS" --remote "wording:$id" || true
            for k in $(npx -y wrangler@4 kv key list --namespace-id="$NS" --remote --prefix "wording-img:$id:" | jq -r '.[].name'); do
              npx -y wrangler@4 kv key delete --namespace-id="$NS" --remote "$k" || true
            done
          done < "$RUNNER_TEMP/applied.txt"
