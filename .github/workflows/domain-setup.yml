name: Domain setup (nutriin.app)

# Свързва собствения домейн на Nutriin с worker-а „aidiet“ (app-domain.js):
#  1. зоната в Cloudflare (създава се, ако я няма) → DNS сървърите за регистратора (Namecheap);
#  2. Custom Domain на worker-а за домейна и www (Cloudflare сам прави DNS записите и сертификата).
# Безопасно е да се пуска многократно. Резултатът е в „Summary“ на задачата.
# Репото е публично: печатат се само имена и състояния, никога ключове.

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Домейнът'
        required: false
        default: 'nutriin.app'
  push:
    branches: [claude/jolly-goodall-obbojn]
    paths: ['.github/workflows/domain-setup.yml']
  # След всяко публикуване на worker-а: довършва пощата за изпращане от nutriin.app (Resend), докато
  # Resend не потвърди домейна — после стъпката спира веднага (1 четене от KV).
  workflow_run:
    workflows: ['Deploy Cloudflare Worker']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: domain-setup
  cancel-in-progress: false

jobs:
  setup:
    if: github.event_name != 'workflow_run' && (github.event_name == 'push' || github.actor == github.repository_owner)
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DOMAIN: ${{ inputs.domain || 'nutriin.app' }}
      SERVICE: aidiet
    steps:
      - name: Zone + worker custom domains
        run: |
          set -u
          api() { curl -sS -X "$1" "https://api.cloudflare.com/client/v4$2" -H "Authorization: Bearer $CF_TOKEN" -H 'Content-Type: application/json' ${3:+--data "$3"}; }
          say() { echo "$*" | tee -a "$GITHUB_STEP_SUMMARY"; }
          errs() { jq -r '[.errors[]? | "\(.code): \(.message)"] | join("; ")'; }
          say "## $DOMAIN"
          say ''

          # 1) Зоната
          zone=$(api GET "/zones?name=$DOMAIN&account.id=$CF_ACCOUNT")
          zid=$(echo "$zone" | jq -r '.result[0].id // empty')
          if [ -z "$zid" ]; then
            created=$(api POST /zones "{\"name\":\"$DOMAIN\",\"account\":{\"id\":\"$CF_ACCOUNT\"},\"type\":\"full\"}")
            zid=$(echo "$created" | jq -r '.result.id // empty')
            if [ -z "$zid" ]; then say "✗ Зоната не е създадена: $(echo "$created" | errs)"; exit 1; fi
            say "✓ Зоната е създадена в Cloudflare."
            zone=$(api GET "/zones/$zid" | jq '{result:[.result]}')
          else
            say "✓ Зоната вече е в Cloudflare."
          fi
          status=$(echo "$zone" | jq -r '.result[0].status')
          say "Състояние на зоната: **$status** (active = DNS сървърите вече сочат към Cloudflare)"
          say ''
          say '### DNS сървъри за Namecheap (Domain List → Manage → Nameservers → Custom DNS)'
          echo "$zone" | jq -r '.result[0].name_servers[]' | while read -r ns; do say "- \`$ns\`"; done
          say ''

          # Записи, които биха пречели на Custom Domain (A/AAAA/CNAME на същото име) — само се показват.
          recs=$(api GET "/zones/$zid/dns_records?per_page=100" | jq -r '.result[]? | "\(.type) \(.name) → \(.content)"')
          [ -n "$recs" ] && { say '### Съществуващи DNS записи'; echo "$recs" | while read -r r; do say "- $r"; done; say ''; }

          # 2) Custom Domain на worker-а
          say '### Worker custom domains'
          ok=1
          for host in "$DOMAIN" "www.$DOMAIN"; do
            res=$(api PUT "/accounts/$CF_ACCOUNT/workers/domains" "{\"hostname\":\"$host\",\"service\":\"$SERVICE\",\"environment\":\"production\",\"zone_id\":\"$zid\"}")
            if [ "$(echo "$res" | jq -r '.success')" = "true" ]; then
              say "- ✓ \`$host\` → worker \`$SERVICE\`"
            else
              # По-новите worker-и нямат „environment“ — втори опит без него.
              res=$(api PUT "/accounts/$CF_ACCOUNT/workers/domains" "{\"hostname\":\"$host\",\"service\":\"$SERVICE\",\"zone_id\":\"$zid\"}")
              if [ "$(echo "$res" | jq -r '.success')" = "true" ]; then say "- ✓ \`$host\` → worker \`$SERVICE\`"
              else say "- ✗ \`$host\`: $(echo "$res" | errs)"; ok=0; fi
            fi
          done
          say ''
          # SSL: Full (strict) — worker-ът отговаря сам, произход няма.
          api PATCH "/zones/$zid/settings/always_use_https" '{"value":"on"}' >/dev/null || true
          say "Всички custom domains на акаунта:"
          api GET "/accounts/$CF_ACCOUNT/workers/domains" | jq -r '.result[]? | "- \(.hostname) → \(.service)"' | while read -r l; do say "$l"; done
          [ "$ok" = 1 ] || exit 1

      # Поща: privacy@<домейн> се препраща към личния имейл на собственика (секретът EMAIL_FORWARD_TO,
      # ако е зададен, иначе адресът по-долу). Cloudflare праща писмо за потвърждение на този адрес:
      # препращането тръгва след клик в него.
      - name: Email routing (privacy@ → личен имейл)
        env:
          FORWARD_TO: ${{ secrets.EMAIL_FORWARD_TO || 'radilov.k@gmail.com' }}
        run: |
          set -u
          api() { curl -sS -X "$1" "https://api.cloudflare.com/client/v4$2" -H "Authorization: Bearer $CF_TOKEN" -H 'Content-Type: application/json' ${3:+--data "$3"}; }
          say() { echo "$*" | tee -a "$GITHUB_STEP_SUMMARY"; }
          errs() { jq -r '[.errors[]? | "\(.code): \(.message)"] | join("; ")'; }
          say ''; say '### Поща'
          if [ -z "${FORWARD_TO:-}" ]; then
            say "- ✗ Няма секрет \`EMAIL_FORWARD_TO\` (Settings → Secrets and variables → Actions) — личният имейл, към който да се препраща."
            exit 0
          fi
          zid=$(api GET "/zones?name=$DOMAIN&account.id=$CF_ACCOUNT" | jq -r '.result[0].id // empty')
          [ -n "$zid" ] || { say "- ✗ Зоната $DOMAIN не е намерена."; exit 1; }
          # 1) Email Routing и MX записите му.
          r=$(api POST "/zones/$zid/email/routing/dns" '{}')
          if [ "$(echo "$r" | jq -r '.success')" = "true" ]; then say "- ✓ Email Routing е включен (MX записите са добавени)"
          else
            r2=$(api POST "/zones/$zid/email/routing/enable" '{}')
            if [ "$(echo "$r2" | jq -r '.success')" = "true" ]; then say "- ✓ Email Routing е включен"
            else say "- ✗ Email Routing: $(echo "$r" | errs) $(echo "$r2" | errs) — токенът трябва да има права Email Routing (зона) и Email Routing Addresses (акаунт)"; exit 1; fi
          fi
          # 2) Адресът за получаване (Cloudflare праща писмо за потвърждение).
          addr=$(api POST "/accounts/$CF_ACCOUNT/email/routing/addresses" "$(jq -n --arg e "$FORWARD_TO" '{email:$e}')")
          verified=$(api GET "/accounts/$CF_ACCOUNT/email/routing/addresses?per_page=50" | jq -r --arg e "$FORWARD_TO" '.result[]? | select((.email|ascii_downcase)==($e|ascii_downcase)) | .verified // empty')
          if [ -n "$verified" ] && [ "$verified" != "null" ]; then say "- ✓ Личният имейл е потвърден"
          else say "- … Личният имейл чака потвърждение: отвори писмото от Cloudflare и натисни линка, после пусни този workflow пак"; fi
          # 3) Правилото privacy@ → личния имейл (не се дублира).
          to="privacy@$DOMAIN"
          have=$(api GET "/zones/$zid/email/routing/rules?per_page=50" | jq -r --arg t "$to" '[.result[]? | select(any(.matchers[]?; .value==$t))] | length')
          if [ "${have:-0}" -gt 0 ]; then say "- ✓ Правилото \`$to\` вече съществува"
          else
            rule=$(jq -n --arg t "$to" --arg d "$FORWARD_TO" '{name:"privacy", enabled:true, matchers:[{type:"literal", field:"to", value:$t}], actions:[{type:"forward", value:[$d]}]}')
            res=$(api POST "/zones/$zid/email/routing/rules" "$rule")
            if [ "$(echo "$res" | jq -r '.success')" = "true" ]; then say "- ✓ \`$to\` → личния имейл"
            else say "- ✗ Правилото: $(echo "$res" | errs)"; exit 1; fi
          fi

  # Изпращане от nutriin.app (EMAIL_DOMAIN в email-domain.js): worker-ът (има ключа за Resend) регистрира домейна, тук (ключът за
  # Cloudflare) се слагат DNS записите и се иска потвърждение. Достъпът до worker-а — еднократен код в KV.
  resend:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DOMAIN: nutriin.app
      KV: https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/storage/kv/namespaces/81fc0991b2764918b682f9ca170abd4b
      WORKER: https://aidiet.radilov-k.workers.dev
    steps:
      - name: Resend — изпращане от nutriin.app
        run: |
          set -u
          api() { curl -sS -X "$1" "https://api.cloudflare.com/client/v4$2" -H "Authorization: Bearer $CF_TOKEN" -H 'Content-Type: application/json' ${3:+--data "$3"}; }
          say() { echo "$*" | tee -a "$GITHUB_STEP_SUMMARY"; }
          say '### Изпращане от nutriin.app (Resend)'
          # Флагът пази кой домейн е потвърден (до прехода — eatologix.com).
          if [ "$(curl -sf -H "Authorization: Bearer $CF_TOKEN" "$KV/values/email_domain_verified" | jq -r '.domain // empty' 2>/dev/null)" = "$DOMAIN" ]; then
            say "- ✓ Домейнът вече е потвърден — писмата излизат от info@$DOMAIN"; exit 0
          fi
          # Ключът за Resend в worker-а е само за изпращане → автоматичните пускания спират тук (ръчното опитва пак).
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ] && curl -sf -H "Authorization: Bearer $CF_TOKEN" "$KV/values/email_domain_skip" >/dev/null; then
            say "- Пропуснато: ключът за Resend е само за изпращане — писмата излизат от info@biocode.online"; exit 0
          fi
          nonce=$(openssl rand -hex 24)
          curl -sf -X PUT -H "Authorization: Bearer $CF_TOKEN" --data "$nonce" "$KV/values/bridge_nonce:email_domain?expiration_ttl=900" >/dev/null || { say "- ✗ Кодът за достъп не е записан в KV"; exit 1; }
          trap 'curl -s -X DELETE -H "Authorization: Bearer $CF_TOKEN" "$KV/values/bridge_nonce:email_domain" >/dev/null' EXIT
          call() { curl -sS -X POST "$WORKER/api/system/email-domain" -H "X-Bridge-Nonce: $nonce" -H 'Content-Type: application/json' --data "{\"action\":\"$1\"}"; }
          setup=$(call setup)
          if [ -z "$(echo "$setup" | jq -r '.records // empty')" ]; then
            err=$(echo "$setup" | jq -r '.error // .')
            if echo "$err" | grep -qi 'restricted to only send'; then
              curl -sf -X PUT -H "Authorization: Bearer $CF_TOKEN" --data "$(date -u +%FT%TZ)" "$KV/values/email_domain_skip" >/dev/null || true
              say "- Ключът за Resend е само за изпращане — домейнът не може да се регистрира автоматично."
              say "- Писмата продължават от досегашния подател (доказано, не падат в спам). Следващите автоматични пускания спират веднага."
              exit 0
            fi
            say "- ✗ Worker-ът: $err"; say "  (ако пише forbidden/404 — новата версия на worker-а още не е публикувана)"; exit 1
          fi
          say "- Resend: домейнът е регистриран (състояние: $(echo "$setup" | jq -r .status))"
          zid=$(api GET "/zones?name=$DOMAIN&account.id=$CF_ACCOUNT" | jq -r '.result[0].id // empty')
          [ -n "$zid" ] || { say "- ✗ Зоната $DOMAIN не е намерена"; exit 1; }
          add() {  # type name content [priority]
            local type=$1 name=$2 content=$3 prio=${4:-}
            have=$(api GET "/zones/$zid/dns_records?type=$type&name=$name" | jq -r --arg c "$content" '[.result[]? | select((.content|gsub("\"";""))==($c|gsub("\"";"")))] | length')
            if [ "${have:-0}" -gt 0 ]; then say "- ✓ $type $name (вече има)"; return; fi
            body=$(jq -n --arg t "$type" --arg n "$name" --arg c "$content" --arg p "$prio" '{type:$t,name:$n,content:$c,ttl:1,proxied:false} + (if $p != "" then {priority:($p|tonumber)} else {} end)')
            res=$(api POST "/zones/$zid/dns_records" "$body")
            if [ "$(echo "$res" | jq -r .success)" = "true" ]; then say "- ✓ $type $name добавен"; else say "- ✗ $type $name: $(echo "$res" | jq -r '[.errors[]?.message]|join("; ")')"; fi
          }
          echo "$setup" | jq -c '.records[]' | while read -r r; do
            t=$(echo "$r" | jq -r .type); n=$(echo "$r" | jq -r .name); v=$(echo "$r" | jq -r .value); p=$(echo "$r" | jq -r '.priority // empty')
            case "$n" in ""|"@") n="$DOMAIN";; *".$DOMAIN"|"$DOMAIN") ;; *) n="$n.$DOMAIN";; esac
            add "$t" "$n" "$v" "$p"
          done
          # DMARC (наблюдение, без отказ) — както при biocode.online.
          dm=$(api GET "/zones/$zid/dns_records?type=TXT&name=_dmarc.$DOMAIN" | jq -r '.result | length')
          [ "${dm:-0}" -gt 0 ] && say "- ✓ DMARC (вече има)" || add TXT "_dmarc.$DOMAIN" "v=DMARC1; p=none;"
          # Потвърждение: DNS се разпространява за минути.
          for i in $(seq 1 12); do
            sleep 30
            st=$(call verify | jq -r '.status // "?"')
            say "- проверка $i: $st"
            [ "$st" = "verified" ] && { say "- ✓ Потвърдено — писмата вече излизат от info@$DOMAIN"; exit 0; }
          done
          say "- … Още не е потвърдено (DNS може да отнеме до час) — следващото публикуване на worker-а или ръчно пускане проверява пак."
