name: Culinary AI (recipes + audit)

# AI пише рецепти за новите ястия и преглежда съчетанията. Само ръчно.
# Резултатът отива в нов клон за преглед (PR) — нищо не стига до клиент без човек.
# Цена: само заявки към Gemini; Cloudflare не участва.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'recipes — рецепти за ястията без рецепта; audit — кулинарен преглед'
        required: true
        default: recipes
        type: choice
        options: [recipes, audit]

permissions:
  contents: write

jobs:
  culinary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODE: ${{ inputs.mode }}
        run: node scripts/culinary/ai-culinary.mjs "$MODE"
      - name: Validate recipes
        run: node scripts/culinary/validate.mjs
      - name: Push to a review branch
        env:
          MODE: ${{ inputs.mode }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/engine/recipes.json data/engine/culinary-audit.json 2>/dev/null || true
          git diff --staged --quiet && { echo "Няма промени."; exit 0; }
          BRANCH="culinary/${MODE}-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git commit -m "chore(culinary): AI ${MODE} (за преглед)"
          git push origin "$BRANCH"
          echo "Клон за преглед: $BRANCH — отворете PR към main."
