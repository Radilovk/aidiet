name: Студиа

# Платформата за студиа без команди: Actions → „Студиа“ → Run workflow.
#  * create     — ново студио (id = поддомейнът, напр. burgas → https://burgas.biocode-bg.com) + 5-цифрен admin
#                 код, който отива по Viber на телефона (не се печата: репото е публично).
#  * reset-pin  — нов admin код по Viber (старите входове се затварят).
#  * domain     — поддомейнът на студио наново (ако при create не е станал).
#  * list       — студиата.
#  * ensure-db  — базата и таблиците (прави се и при всеки деплой).
# Кодът за вход в admin (5 цифри) е ТАЕН: първо създай GitHub секрет STUDIO_PIN_<ID> (напр. STUDIO_PIN_BURGAS; без тире —
# за id с тире или за „все едно кое студио“ има общ STUDIO_DEFAULT_PIN) → Settings → Secrets and variables → Actions.
# Без такъв секрет кодът е случаен и отива по Viber на телефона (полето phone или секрет STUDIO_ADMIN_PHONE).
# Кодът се сменя после от admin → Настройки → Сигурност.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'create | reset-pin | domain | list | ensure-db'
        required: true
        type: choice
        options: [create, reset-pin, domain, list, ensure-db]
      id:
        description: 'id на студиото = поддомейн (малки латински букви, цифри, тире), напр. burgas'
        required: false
        type: string
      name:
        description: 'Име (само за create), напр. XBODY Бургас'
        required: false
        type: string
      phone:
        description: 'Само ако няма секрет STUDIO_PIN_<ID>: телефон за Viber със случаен код (празно = секрет STUDIO_ADMIN_PHONE)'
        required: false
        type: string

permissions:
  contents: read

concurrency: studio-admin

jobs:
  run:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACTION: ${{ inputs.action }}
          SID: ${{ inputs.id }}
          SNAME: ${{ inputs.name }}
          SPHONE: ${{ inputs.phone || secrets.STUDIO_ADMIN_PHONE }}
          STUDIO_PIN: ${{ secrets[format('STUDIO_PIN_{0}', inputs.id)] || secrets.STUDIO_DEFAULT_PIN }}
        run: |
          case "$ACTION" in
            ensure-db) node scripts/studio-admin.mjs ensure-db > /dev/null ;;
            create)    node scripts/studio-admin.mjs ensure-db > /dev/null && node scripts/studio-admin.mjs create "$SID" "$SNAME" "$SPHONE" ;;
            reset-pin) node scripts/studio-admin.mjs reset-pin "$SID" "$SPHONE" ;;
            *)         node scripts/studio-admin.mjs "$ACTION" "$SID" ;;
          esac | tee -a "$GITHUB_STEP_SUMMARY"
          exit ${PIPESTATUS[0]}
