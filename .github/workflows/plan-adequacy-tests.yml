name: Plan Adequacy Tests

on:
  push:
    branches:
      - main
    paths:
      - 'KV/**'
      - 'plan-response-schemas.js'
      - 'worker.entry.js'
      - 'scripts/plan-adequacy/**'
      - 'food-catalog.js'
      - 'food-nutrition.js'
      - 'meal-solver.js'
      - 'scripts/test-solver.mjs'
      - 'nutrition-engine/**'
      - 'food-picker.html'
      - 'plan-review.js'
      - 'scripts/test-food-picker*.mjs'
      - '.github/workflows/plan-adequacy-tests.yml'
  pull_request:
    paths:
      - 'KV/**'
      - 'plan-response-schemas.js'
      - 'worker.entry.js'
      - 'scripts/plan-adequacy/**'
      - 'food-catalog.js'
      - 'food-nutrition.js'
      - 'meal-solver.js'
      - 'scripts/test-solver.mjs'
      - 'nutrition-engine/**'
      - 'food-picker.html'
      - 'plan-review.js'
      - 'scripts/test-food-picker*.mjs'
      - '.github/workflows/plan-adequacy-tests.yml'

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Plan adequacy (offline)
        run: npm run test:plan-adequacy

      - name: Meal solver pipeline
        run: node scripts/test-solver.mjs

      - name: Universality stress (catalog pools)
        run: node test-universality-stress.mjs

      - name: Food picker (Избери храни → менюто)
        run: npm run test:food-picker

      - name: Region (сезон по полукълбо, кухня)
        run: npm run test:region

      - name: Plan review (Claude при всеки план за одобрение)
        run: npm run test:plan-review
