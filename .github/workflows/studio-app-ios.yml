name: Студио приложение — iOS (TestFlight)

# Прави iOS приложението на студиата и го качва в App Store Connect → TestFlight. Пуска се ръчно:
# Actions → „Студио приложение — iOS (TestFlight)“ → Run workflow. Приложението показва живата страница
# (biocode.website/studio.html), затова нова версия е нужна само при промяна на самата обвивка (икона, име, плъгини).
#
# Нужни GitHub секрети (стъпките са в studio-app/README.md):
#   APPLE_TEAM_ID          — Team ID от developer.apple.com → Membership
#   APPSTORE_KEY_ID        — ID на ключа от App Store Connect → Users and Access → Integrations → App Store Connect API
#   APPSTORE_ISSUER_ID     — Issuer ID (на същата страница)
#   APPSTORE_KEY_P8        — съдържанието на изтегления файл AuthKey_XXXX.p8 (целият текст)
# Ключът трябва да е с роля Admin (за да може Xcode сам да направи сертификата и профила — без ръчни файлове).
# GitHub runner-ите с macOS са безплатни за публично репо.

on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Качи в TestFlight (иначе само проверка, че се събира)'
        type: boolean
        default: true
      version:
        description: 'Версия за магазина (маркетингова), напр. 1.0.0'
        type: string
        default: '1.0.0'

permissions:
  contents: read

concurrency: studio-app-ios

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: studio-app
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: studio-app/package-lock.json

      - name: Най-новият Xcode (Apple иска най-новия SDK за качване)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Проверка на секретите
        run: |
          missing=""
          for v in APPLE_TEAM_ID APPSTORE_KEY_ID APPSTORE_ISSUER_ID APPSTORE_KEY_P8; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Липсват GitHub секрети:$missing (виж studio-app/README.md, стъпка 3)"
            exit 1
          fi

      - run: npm ci

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: iOS проект, икони, настройки, манифест за поверителност
        run: |
          gem install xcodeproj --no-document
          npx cap add ios
          npx @capacitor/assets generate --ios --assetPath assets \
            --iconBackgroundColor '#d32f2f' --iconBackgroundColorDark '#d32f2f' \
            --splashBackgroundColor '#d32f2f' --splashBackgroundColorDark '#d32f2f'
          python3 scripts/patch-ios.py
          ruby scripts/add-privacy-manifest.rb
          npx cap sync ios

      - name: Ключ за App Store Connect
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$APPSTORE_KEY_P8" > "$HOME/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          echo "KEY_PATH=$HOME/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Компилиране и подписване (Xcode сам прави сертификата и профила)
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Studio.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="${{ inputs.version }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            TARGETED_DEVICE_FAMILY=1

      - name: Проверка на готовия пакет (преди качване)
        run: |
          APP=$(find "$RUNNER_TEMP/Studio.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' | head -1)
          [ -n "$APP" ] || { echo "::error::Няма .app в архива"; exit 1; }
          [ -f "$APP/PrivacyInfo.xcprivacy" ] || { echo "::error::Няма PrivacyInfo.xcprivacy в пакета (Apple го изисква)"; exit 1; }
          [ -f "$APP/Assets.car" ] || { echo "::error::Няма икони/ресурси (Assets.car)"; exit 1; }
          enc=$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$APP/Info.plist")
          [ "$enc" = "false" ] || { echo "::error::ITSAppUsesNonExemptEncryption не е false"; exit 1; }
          family=$(/usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily:0' "$APP/Info.plist")
          [ "$family" = "1" ] || { echo "::error::Приложението не е само за iPhone (UIDeviceFamily=$family)"; exit 1; }
          if /usr/libexec/PlistBuddy -c 'Print :NSAppTransportSecurity' "$APP/Info.plist" >/dev/null 2>&1; then
            echo "::error::Има изключения от ATS (NSAppTransportSecurity) — Apple иска обосновка"; exit 1
          fi
          echo "Пакетът е наред: $(basename "$APP")"

      - name: Качване в App Store Connect (TestFlight)
        if: ${{ inputs.upload }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Studio.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"
          {
            echo "### Качено в App Store Connect ✓"
            echo "Версия ${{ inputs.version }} (build ${{ github.run_number }}). След 10–30 минути обработка се вижда в TestFlight."
          } >> "$GITHUB_STEP_SUMMARY"
