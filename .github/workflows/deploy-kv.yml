name: Deploy KV Prompts

on:
  push:
    branches:
      - main
    paths:
      - 'KV/**'
      - '.github/workflows/deploy-kv.yml'
  workflow_dispatch:

jobs:
  upload-kv:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Upload all KV keys
        run: bash KV/upload-kv-keys.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_UPLOAD_REMOTE: '1'

      - name: Verify uploaded keys
        run: |
          NS="81fc0991b2764918b682f9ca170abd4b"
          # Всеки качен файл трябва да се чете обратно от KV; спрените ключове не бива да съществуват.
          for f in KV/*.txt KV/prompts/*.txt; do
            key="$(basename "$f" .txt)"
            [ "$key" = "retired-keys" ] && continue
            npx wrangler kv key get --namespace-id="$NS" "$key" --remote > /dev/null || { echo "::error::липсва ключ $key"; exit 1; }
          done
          while IFS= read -r line; do
            key="$(echo "${line%%#*}" | tr -d '[:space:]')"
            [ -z "$key" ] && continue
            if npx wrangler kv key get --namespace-id="$NS" "$key" --remote > /dev/null 2>&1; then
              echo "::error::спрян ключ още съществува: $key"; exit 1
            fi
          done < KV/retired-keys.txt
          echo "KV е синхронизиран."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
