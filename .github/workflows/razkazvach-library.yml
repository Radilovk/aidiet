# redeploy: community library (2026-10-22)
# Temporary bridge: deploys the Разказвач library worker (Radilovk/tts → server/)
# with this repo's Cloudflare secrets. Lives only on a claude/* branch.
name: Deploy Razkazvach library worker

on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/razkazvach-library.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Radilovk/tts
          ref: claude/pensive-ramanujan-uz7r77
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: R2 bucket
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx --yes wrangler@4 r2 bucket list 2>&1 | tee /tmp/r2list.txt | grep -q 'razkazvach-audio'; then
            echo "R2 bucket exists"
          elif npx --yes wrangler@4 r2 bucket create razkazvach-audio 2>&1 | tee /tmp/r2create.txt; then
            echo "R2 bucket created"
          else
            echo "::warning::R2 not available: $(tail -3 /tmp/r2create.txt)"
            sed -i '/\[\[r2_buckets\]\]/,$d' wrangler.toml
          fi
      - name: Deploy
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy 2>&1 | tee /tmp/deploy.txt
      - name: Health
        run: |
          sleep 5
          curl -sS https://razkazvach-library.radilov-k.workers.dev/health || true
          echo
          grep -E "https://.*workers.dev" /tmp/deploy.txt || true
