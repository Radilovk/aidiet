name: Студио приложение — Android

# Прави Android приложението на студиата. Пуска се ръчно: Actions → „Студио приложение — Android“ → Run workflow.
#  * Подписан APK за инсталиране — качва се като GitHub Release „studio-android-v<версия>“ (XB-Studio.apk; постоянна
#    връзка: …/releases/download/studio-android-latest/XB-Studio.apk). Ключът: STUDIO_KEYSTORE_* ако ги има, иначе
#    ключът на NutriPlan APK (KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_PASSWORD, alias nutriplan). Без ключ — debug APK.
#  * Ако има секрети STUDIO_KEYSTORE_*: и подписан AAB за Google Play (Play Console → Production / Internal testing).
#
# Секрети за Google Play (по желание; ключът се прави веднъж — виж studio-app/README.md):
#   STUDIO_KEYSTORE_BASE64   — файлът .keystore, кодиран с base64
#   STUDIO_KEYSTORE_PASSWORD — парола на хранилището
#   STUDIO_KEY_ALIAS         — име (alias) на ключа
#   STUDIO_KEY_PASSWORD      — парола на ключа

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия за магазина, напр. 1.0.0'
        type: string
        default: '1.2.0'

permissions:
  contents: write   # the GitHub Release with the APK

concurrency: studio-app-android

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: studio-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: studio-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - run: npm ci

      - name: Android проект, икони, настройки
        env:
          STUDIO_V_CODE: ${{ github.run_number }}
          STUDIO_V_NAME: ${{ inputs.version }}
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --assetPath assets \
            --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff' \
            --splashBackgroundColor '#ffffff' --splashBackgroundColorDark '#ffffff'
          python3 scripts/patch-android.py
          npx cap sync android

      - name: Подписан APK (ключът на студиото или на NutriPlan; без ключ — debug)
        env:
          S_KS: ${{ secrets.STUDIO_KEYSTORE_BASE64 }}
          S_PASS: ${{ secrets.STUDIO_KEYSTORE_PASSWORD }}
          S_ALIAS: ${{ secrets.STUDIO_KEY_ALIAS }}
          S_KEYPASS: ${{ secrets.STUDIO_KEY_PASSWORD }}
          N_KS: ${{ secrets.KEYSTORE_BASE64 }}
          N_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          N_KEYPASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          if [ -n "$S_KS" ] && [ -n "$S_PASS" ] && [ -n "$S_ALIAS" ]; then
            KS="$S_KS"; PASS="$S_PASS"; ALIAS="$S_ALIAS"; KPASS="${S_KEYPASS:-$S_PASS}"; echo "ключ: на студиото"
          elif [ -n "$N_KS" ] && [ -n "$N_PASS" ]; then
            KS="$N_KS"; PASS="$N_PASS"; ALIAS="nutriplan"; KPASS="${N_KEYPASS:-$N_PASS}"; echo "ключ: на NutriPlan"
          else
            echo "::warning::Няма ключ за подписване — правя debug APK."
            (cd android && ./gradlew --no-daemon assembleDebug)
            cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/out/XB-Studio.apk"
            exit 0
          fi
          export PASS KPASS
          (cd android && ./gradlew --no-daemon assembleRelease)
          printf '%s' "$KS" | base64 --decode > "$RUNNER_TEMP/studio.keystore"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/studio.keystore" --ks-pass env:PASS --ks-key-alias "$ALIAS" \
            --key-pass env:KPASS --out "$RUNNER_TEMP/out/XB-Studio.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "$RUNNER_TEMP/out/XB-Studio.apk" | grep -i 'SHA-256' | head -1
          rm -f "$RUNNER_TEMP/studio.keystore"

      - name: Проверка на пакета
        run: |
          APK="$RUNNER_TEMP/out/XB-Studio.apk"
          [ -f "$APK" ] || { echo "::error::Няма APK"; exit 1; }
          # a release build shortens the files' paths inside the APK: the sound is looked up by its resource name
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump resources "$APK" | grep -q 'raw/studio' || { echo "::error::Няма звука в пакета"; exit 1; }
          echo "APK: $(du -h "$APK" | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: studio-app-apk
          path: ${{ runner.temp }}/out/XB-Studio.apk
          retention-days: 30

      - name: GitHub Release (връзка за сваляне)
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ inputs.version }}
        run: |
          cp "$RUNNER_TEMP/out/XB-Studio.apk" "$RUNNER_TEMP/out/XB-Studio-v$V.apk"
          for TAG in "studio-android-v$V" "studio-android-latest"; do
            gh release delete "$TAG" -y --cleanup-tag --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
              --title "XB-Studio за Android $V" --notes "Приложението за записване на часове в студиата (XBODY Бургас и др.). Инсталиране: свали XB-Studio.apk на телефона и го отвори." \
              "$RUNNER_TEMP/out/XB-Studio.apk" "$RUNNER_TEMP/out/XB-Studio-v$V.apk"
          done
          echo "https://github.com/$GITHUB_REPOSITORY/releases/download/studio-android-latest/XB-Studio.apk" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Подписан AAB за Google Play (само ако има ключ)
        env:
          KS_B64: ${{ secrets.STUDIO_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.STUDIO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.STUDIO_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.STUDIO_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "Няма секрети за ключ — пропускам подписания AAB (debug APK-то е качено)."
            exit 0
          fi
          (cd android && ./gradlew --no-daemon bundleRelease)
          printf '%s' "$KS_B64" | base64 --decode > "$RUNNER_TEMP/studio.keystore"
          cp android/app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/studio.aab"
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore "$RUNNER_TEMP/studio.keystore" \
            -storepass "$KS_PASS" -keypass "$KEY_PASS" "$RUNNER_TEMP/studio.aab" "$KEY_ALIAS"
          echo "AAB_READY=1" >> "$GITHUB_ENV"
          echo "AAB_PATH=$RUNNER_TEMP/studio.aab" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        if: ${{ env.AAB_READY == '1' }}
        with:
          name: studio-app-aab
          path: ${{ env.AAB_PATH }}
          retention-days: 30
