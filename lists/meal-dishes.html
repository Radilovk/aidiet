<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ястия — NutriPlan списъци</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="./list-editor.css">
</head>
<body>
  <div class="shell">
    <a class="back" href="../lists-hub.html">← Всички списъци</a>
    <h1><i class="fas fa-plate-wheat"></i> Ястия (meal-dishes)</h1>
    <p class="sub">2–4 продукта с референтни грамажи. Планът мащабира порцията — не дублирай „обилни“ версии.</p>

    <div class="toolbar">
      <input type="search" id="search" placeholder="Търсене…" style="max-width:240px">
      <button type="button" class="btn ghost" id="reload">Обнови</button>
      <button type="button" class="btn" id="newBtn">+ Ново ястие</button>
      <button type="button" class="btn warn" id="download">Изтегли JSON</button>
      <label class="btn ghost" style="cursor:pointer"><i class="fas fa-upload"></i> Импорт JSON<input type="file" id="fileIn" accept=".json" class="hidden"></label>
      <span class="badge" id="meta">—</span>
    </div>

    <div class="card table-wrap">
      <table>
        <thead><tr><th>ID</th><th>Име</th><th>Продукти</th><th>Времена</th><th>univ</th></tr></thead>
        <tbody id="table"></tbody>
      </table>
      <div class="status" id="listStatus"></div>
    </div>

    <div class="card hidden" id="editor">
      <h2 id="editorTitle">Ястие</h2>
      <div class="grid">
        <div class="field"><label for="id">ID (стабилен)</label><input id="id" placeholder="meal_chicken_rice"></div>
        <div class="field"><label for="name">Име</label><input id="name"></div>
        <div class="field"><label for="timing">timing (CSV)</label><input id="timing" value="main"></div>
        <div class="field"><label for="univ">universality 1–5</label><input id="univ" type="number" min="1" max="5" value="4"></div>
        <div class="field"><label><input type="checkbox" id="vegan"> vegan</label></div>
        <div class="field"><label><input type="checkbox" id="vegetarian" checked> vegetarian</label></div>
        <div class="field" style="grid-column:1/-1"><label for="tags">tags (CSV)</label><input id="tags" placeholder="low_carb, sweet_slot"></div>
        <div class="field" style="grid-column:1/-1">
          <label for="products">Продукти (един на ред: име: грамове)</label>
          <textarea id="products" rows="5" placeholder="пилешко месо: 150&#10;ориз: 80"></textarea>
        </div>
      </div>
      <div class="toolbar" style="margin-top:8px">
        <button type="button" class="btn" id="apply">Приложи</button>
        <button type="button" class="btn danger ghost" id="delete">Изтрий</button>
      </div>
      <div class="status" id="editStatus"></div>
    </div>

    <div class="card">
      <p class="sub">След редакция: запази JSON и пусни <code>npm run lists:import</code> в терминала.</p>
    </div>
  </div>
  <script type="module">
    import {
      loadListJson, downloadJson, setStatus, filterRows, bindFileImport,
      parseCsv, joinCsv, productLinesToArray, productsToLines,
    } from './list-editor-core.js';

    const JSON_URL = '../data/lists/meal-dishes.json';
    let doc = null;
    let selectedId = null;

    function render() {
      const q = document.getElementById('search').value;
      const tbody = document.getElementById('table');
      tbody.innerHTML = '';
      const rows = filterRows(doc.dishes || [], q, ['id', 'name', 'timing', 'tags']);
      for (const d of rows) {
        const tr = document.createElement('tr');
        if (d.id === selectedId) tr.classList.add('selected');
        const prods = (d.products || []).map(p => `${p.name} ${p.grams}g`).join(', ');
        tr.innerHTML = `<td>${d.id}</td><td>${d.name}</td><td>${prods}</td><td>${joinCsv(d.timing)}</td><td>${d.universality ?? 4}</td>`;
        tr.onclick = () => { selectedId = d.id; fillForm(d); document.getElementById('editor').classList.remove('hidden'); render(); };
        tbody.appendChild(tr);
      }
      document.getElementById('meta').textContent = `${doc.dishes.length} ястия`;
    }

    function fillForm(d) {
      document.getElementById('id').value = d?.id || '';
      document.getElementById('name').value = d?.name || '';
      document.getElementById('timing').value = joinCsv(d?.timing || ['main']);
      document.getElementById('univ').value = d?.universality ?? 4;
      document.getElementById('vegan').checked = !!d?.vegan;
      document.getElementById('vegetarian').checked = d?.vegetarian !== false;
      document.getElementById('tags').value = joinCsv(d?.tags);
      document.getElementById('products').value = d?.products ? productsToLines(d.products) : '';
      document.getElementById('editorTitle').textContent = d?.id ? `Редакция: ${d.name}` : 'Ново ястие';
    }

    function readForm() {
      const products = productLinesToArray(document.getElementById('products').value);
      return {
        id: document.getElementById('id').value.trim(),
        name: document.getElementById('name').value.trim(),
        products,
        timing: parseCsv(document.getElementById('timing').value),
        vegan: document.getElementById('vegan').checked,
        vegetarian: document.getElementById('vegetarian').checked,
        universality: Number(document.getElementById('univ').value) || 4,
        tags: parseCsv(document.getElementById('tags').value),
      };
    }

    async function load() {
      setStatus(document.getElementById('listStatus'), 'Зареждане…');
      try {
        doc = await loadListJson(JSON_URL);
        render();
        setStatus(document.getElementById('listStatus'), `Заредено · ${doc.updatedAt?.slice(0, 19) || ''}`, 'ok');
      } catch (e) {
        setStatus(document.getElementById('listStatus'), e.message, 'err');
      }
    }

    document.getElementById('reload').onclick = load;
    document.getElementById('search').oninput = render;
    document.getElementById('newBtn').onclick = () => {
      selectedId = null;
      fillForm({ timing: ['main'], universality: 4, vegetarian: true, products: [] });
      document.getElementById('editor').classList.remove('hidden');
    };
    document.getElementById('apply').onclick = () => {
      try {
        const entry = readForm();
        if (!entry.id) throw new Error('ID е задължително');
        if (!entry.name) throw new Error('Име е задължително');
        if (entry.products.length < 2 || entry.products.length > 4) throw new Error('2–4 продукта');
        const idx = doc.dishes.findIndex(d => d.id === entry.id);
        if (idx >= 0 && entry.id !== selectedId) throw new Error('ID вече съществува');
        if (idx >= 0) doc.dishes[idx] = entry; else doc.dishes.push(entry);
        doc.count = doc.dishes.length;
        doc.updatedAt = new Date().toISOString();
        selectedId = entry.id;
        render();
        setStatus(document.getElementById('editStatus'), 'Приложено — изтегли JSON и пусни lists:import', 'ok');
      } catch (e) {
        setStatus(document.getElementById('editStatus'), e.message, 'err');
      }
    };
    document.getElementById('delete').onclick = () => {
      if (!selectedId) return;
      doc.dishes = doc.dishes.filter(d => d.id !== selectedId);
      doc.count = doc.dishes.length;
      selectedId = null;
      document.getElementById('editor').classList.add('hidden');
      render();
    };
    document.getElementById('download').onclick = () => {
      doc.updatedAt = new Date().toISOString();
      downloadJson('meal-dishes.json', doc);
    };
    bindFileImport(document.getElementById('fileIn'), data => {
      doc = data;
      selectedId = null;
      render();
      setStatus(document.getElementById('listStatus'), 'Импортиран JSON в паметта — изтегли за запис', 'ok');
    });
    load();
  </script>
</body>
</html>
