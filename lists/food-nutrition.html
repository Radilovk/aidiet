<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Хранителност — NutriPlan списъци</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="./list-editor.css">
</head>
<body>
  <div class="shell">
    <a class="back" href="../lists-hub.html">← Всички списъци</a>
    <h1><i class="fas fa-chart-pie"></i> Хранителност (food-nutrition)</h1>
    <p class="sub">kcal, протеин, въглехидрати, мазнини на 100 g по nutritionKey.</p>

    <div class="toolbar">
      <input type="search" id="search" placeholder="Търсене…" style="max-width:240px">
      <button type="button" class="btn ghost" id="reload">Обнови</button>
      <button type="button" class="btn" id="newBtn">+ Нов ключ</button>
      <button type="button" class="btn warn" id="download">Изтегли JSON</button>
      <label class="btn ghost" style="cursor:pointer"><i class="fas fa-upload"></i> Импорт JSON<input type="file" id="fileIn" accept=".json" class="hidden"></label>
      <span class="badge" id="meta">—</span>
    </div>

    <div class="card table-wrap">
      <table>
        <thead><tr><th>nutritionKey</th><th>kcal</th><th>P</th><th>C</th><th>F</th></tr></thead>
        <tbody id="table"></tbody>
      </table>
      <div class="status" id="listStatus"></div>
    </div>

    <div class="card hidden" id="editor">
      <h2 id="editorTitle">Запис</h2>
      <div class="grid">
        <div class="field" style="grid-column:1/-1"><label for="key">nutritionKey</label><input id="key"></div>
        <div class="field"><label for="kcal">kcal</label><input id="kcal" type="number"></div>
        <div class="field"><label for="p">протеин (g)</label><input id="p" type="number" step="0.1"></div>
        <div class="field"><label for="c">въглехидрати (g)</label><input id="c" type="number" step="0.1"></div>
        <div class="field"><label for="f">мазнини (g)</label><input id="f" type="number" step="0.1"></div>
      </div>
      <div class="toolbar" style="margin-top:8px">
        <button type="button" class="btn" id="apply">Приложи</button>
        <button type="button" class="btn danger ghost" id="delete">Изтрий</button>
      </div>
      <div class="status" id="editStatus"></div>
    </div>
  </div>
  <script type="module">
    import { loadListJson, downloadJson, setStatus, bindFileImport } from './list-editor-core.js';

    const JSON_URL = '../data/lists/food-nutrition.json';
    let doc = null;
    let selectedKey = null;

    function entriesArray() {
      return Object.entries(doc.entries || {}).map(([key, vals]) => ({ key, vals }));
    }

    function render() {
      const q = document.getElementById('search').value.trim().toLowerCase();
      const tbody = document.getElementById('table');
      tbody.innerHTML = '';
      for (const row of entriesArray().filter(r => !q || r.key.toLowerCase().includes(q))) {
        const [kcal, p, c, f] = row.vals;
        const tr = document.createElement('tr');
        if (row.key === selectedKey) tr.classList.add('selected');
        tr.innerHTML = `<td>${row.key}</td><td>${kcal}</td><td>${p}</td><td>${c}</td><td>${f}</td>`;
        tr.onclick = () => {
          selectedKey = row.key;
          document.getElementById('key').value = row.key;
          document.getElementById('kcal').value = kcal;
          document.getElementById('p').value = p;
          document.getElementById('c').value = c;
          document.getElementById('f').value = f;
          document.getElementById('editor').classList.remove('hidden');
          document.getElementById('editorTitle').textContent = row.key;
          render();
        };
        tbody.appendChild(tr);
      }
      document.getElementById('meta').textContent = `${Object.keys(doc.entries).length} ключа`;
    }

    async function load() {
      setStatus(document.getElementById('listStatus'), 'Зареждане…');
      try {
        doc = await loadListJson(JSON_URL);
        render();
        setStatus(document.getElementById('listStatus'), 'Заредено', 'ok');
      } catch (e) {
        setStatus(document.getElementById('listStatus'), e.message, 'err');
      }
    }

    document.getElementById('reload').onclick = load;
    document.getElementById('search').oninput = render;
    document.getElementById('newBtn').onclick = () => {
      selectedKey = null;
      document.getElementById('key').value = '';
      document.getElementById('kcal').value = '';
      document.getElementById('p').value = '';
      document.getElementById('c').value = '';
      document.getElementById('f').value = '';
      document.getElementById('editorTitle').textContent = 'Нов ключ';
      document.getElementById('editor').classList.remove('hidden');
    };
    document.getElementById('apply').onclick = () => {
      try {
        const key = document.getElementById('key').value.trim();
        const vals = [
          Number(document.getElementById('kcal').value),
          Number(document.getElementById('p').value),
          Number(document.getElementById('c').value),
          Number(document.getElementById('f').value),
        ];
        if (!key) throw new Error('Ключ е задължителен');
        if (vals.some(v => !Number.isFinite(v))) throw new Error('Всички макроси трябва да са числа');
        if (selectedKey && selectedKey !== key) delete doc.entries[selectedKey];
        doc.entries[key] = vals;
        doc.count = Object.keys(doc.entries).length;
        doc.updatedAt = new Date().toISOString();
        selectedKey = key;
        render();
        setStatus(document.getElementById('editStatus'), 'Приложено — изтегли JSON', 'ok');
      } catch (e) { setStatus(document.getElementById('editStatus'), e.message, 'err'); }
    };
    document.getElementById('delete').onclick = () => {
      if (!selectedKey) return;
      delete doc.entries[selectedKey];
      doc.count = Object.keys(doc.entries).length;
      selectedKey = null;
      document.getElementById('editor').classList.add('hidden');
      render();
    };
    document.getElementById('download').onclick = () => { doc.updatedAt = new Date().toISOString(); downloadJson('food-nutrition.json', doc); };
    bindFileImport(document.getElementById('fileIn'), data => { doc = data; selectedKey = null; render(); });
    load();
  </script>
</body>
</html>
