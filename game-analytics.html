    <style>
        :root {
            --primary-red: #05737D;
            --soft-red: #CDF9F6;
            --accent-yellow: #fbbf24;
            --accent-blue: #06B6D4;
            --accent-light-red: #f87171;
            --text-dark: #0F2F2E;
            --text-light: #6b7280;
            --bg-color: #EDF5F0;
            --card-bg: rgba(255, 255, 255, 0.72);
            --shadow: 0 4px 12px rgba(3,147,156,0.08);
            --radius: 24px;
            --glass-blur: 20px;
            --glass-border: rgba(3, 147, 156, 0.1);
            --safe-area-inset-top: env(safe-area-inset-top, 0px);
            --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
            --safe-area-inset-left: env(safe-area-inset-left, 0px);
            --safe-area-inset-right: env(safe-area-inset-right, 0px);
        }

        [data-theme="dark"] {
            --primary-red: #19D6D2;
            --soft-red: #034E5C;
            --accent-yellow: #fcd34d;
            --accent-blue: #60a5fa;
            --accent-light-red: #fca5a5;
            --text-dark: #E0F5F0;
            --text-light: #9ca3af;
            --bg-color: #0A1A1A;
            --card-bg: rgba(20, 55, 55, 0.78);
            --shadow: 0 4px 12px rgba(0,0,0,0.25), 0 0 4px rgba(25,214,210,0.1);
            --radius: 24px;
            --glass-blur: 20px;
            --glass-border: rgba(25, 214, 210, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            transition: background-color 0.3s ease, color 0.3s ease;
            padding-bottom: calc(80px + var(--safe-area-inset-bottom));
        }

        /* --- PAGE HEADER --- */
        .page-header {
            background: var(--card-bg);
            padding: calc(18px + var(--safe-area-inset-top)) calc(16px + var(--safe-area-inset-right)) 14px calc(16px + var(--safe-area-inset-left));
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(var(--glass-blur)) saturate(180%);
            -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
            border-bottom: 1px solid var(--glass-border);
        }

        [data-theme="dark"] .page-header {
            background: rgba(20, 55, 55, 0.92);
            border-bottom-color: var(--glass-border);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
        }

        .back-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            color: var(--text-dark);
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 0;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .back-btn:hover {
            background: rgba(3, 147, 156, 0.08);
            transform: translateX(-3px);
        }

        .page-header h1 {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--text-dark);
            letter-spacing: -0.3px;
            flex: 1;
            text-align: center;
        }

        .theme-toggle-btn {
            background: var(--ds-fill-grad);
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ds-on-fill);
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 14px rgba(5, 115, 125, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            flex-shrink: 0;
        }

        .theme-toggle-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, transparent 50%);
            pointer-events: none;
        }

        .theme-toggle-btn:hover {
            transform: scale(1.1) rotate(-8deg);
            box-shadow: 0 8px 20px rgba(5, 115, 125, 0.5);
        }

        .theme-toggle-btn:active {
            transform: scale(0.95);
        }

        /* --- CONTAINER --- */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 16px 15px 15px;
        }

        /* --- GAME ANALYTICS SECTION --- */
        .game-analytics-section {
            background: var(--card-bg);
            border-radius: var(--radius);
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            overflow: hidden;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(var(--glass-blur)) saturate(180%);
            -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
        }
        .game-analytics-header {
            padding: 14px 18px;
            background: var(--ds-fill-grad);
            color: var(--ds-on-fill);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .game-analytics-title {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.01em;
        }
        .game-analytics-badge {
            font-size: 0.75rem;
            background: rgba(0,0,0,0.18);
            padding: 3px 9px;
            border-radius: 20px;
            font-weight: 600;
            white-space: nowrap;
        }

        .game-analytics-body {
            padding: 14px 16px 16px;
        }
        /* Weekly overview card */
        .game-week-card {
            background: var(--ds-fill-grad);
            border-radius: 14px;
            padding: 12px 14px;
            margin-bottom: 14px;
            color: var(--ds-on-fill);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .game-week-icon { font-size: 1.7rem; line-height: 1; display:flex; align-items:center; justify-content:center; }
        .game-week-info { flex: 1; min-width: 0; }
        .game-week-title { font-size: 0.78rem; opacity: 0.85; font-weight: 500; }
        .game-week-score { font-size: 1.15rem; font-weight: 800; }
        .game-week-sub   { font-size: 0.75rem; opacity: 0.8; margin-top: 2px; }
        /* 7-day dot strip */
        .game-week-dots { display:flex; gap:4px; margin-top: 7px; }
        .game-week-dot  {
            width:14px; height:14px; border-radius:50%;
            background:#e5e7eb; cursor:default;
            border: 2px solid rgba(255,255,255,0.22);
        }
        /* Health score ring */
        .game-health-ring-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .game-ring-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .game-ring-svg { transform: rotate(-90deg); }
        /* Целта горе в седмицата: лентата казва нивото — числото е в подробностите (докосване) */
        /* Горе: двете ленти — ангажираност (със звездите на дните) и напредък (само при измерване) */
        .ga-bars { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
        .ga-bars .gf-index-value { font-variant-numeric: tabular-nums; }
        .ga-eng { cursor: pointer; }
        /* Кръговете: 5 → два реда (3 + 2, долният центриран), 4 и по-малко → един ред */
        .ga-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-top: 12px; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
        .ga-day { display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 44px; padding: 2px 0; border: 0; background: none; color: inherit; font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        .ga-day-l { font-size: 0.7rem; color: var(--text-light); }
        .ga-day.is-today .ga-day-l, .ga-day.dm-open .ga-day-l { color: var(--text-dark); font-weight: 700; }
        .ga-day:focus-visible { outline: 2px solid var(--ds-green-text, #03939C); outline-offset: 2px; border-radius: 8px; }
        .ga-view-prev.ga-days { margin-top: 0; }
        /* Показателите — пет вида (gaRenderRings); задържане → избор на вида */
        .ga-rings-wrap { margin: 4px 0 12px; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
        .ga-v-row { display: grid; gap: 2px; }
        .ga-v-scroll { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 2px; scrollbar-width: none;
            -webkit-mask-image: linear-gradient(90deg, #000 84%, transparent); mask-image: linear-gradient(90deg, #000 84%, transparent); }
        .ga-v-scroll::-webkit-scrollbar { display: none; }
        .ga-v-scroll .ga-ring { flex: none; scroll-snap-align: start; padding-left: 4px; padding-right: 4px; }
        .ga-ring-ic { position: relative; display: grid; place-items: center; }
        .ga-ring-ic > i { position: absolute; font-size: 17px; }
        .ga-ring-v { font-size: 0.85rem; font-weight: 700; color: var(--text-dark); font-variant-numeric: tabular-nums; }
        .ga-conc { display: flex; align-items: center; gap: 14px; }
        .ga-conc svg { flex: none; }
        .ga-legend { flex: 1; min-width: 0; display: grid; gap: 2px; }
        .ga-legend .ga-ring, .ga-bars .ga-ring { flex-direction: row; justify-content: flex-start; gap: 8px; width: 100%; min-height: 32px; padding: 4px 2px; text-align: left; }
        .ga-legend .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
        .ga-legend .n, .ga-bars .n { font-size: 0.85rem; color: var(--text-dark); }
        .ga-legend .v, .ga-bars .v { margin-left: auto; font-size: 0.85rem; font-weight: 700; color: var(--text-dark); font-variant-numeric: tabular-nums; }
        .ga-bars { display: grid; gap: 2px; }
        .ga-bars .ga-ring > i { width: 20px; text-align: center; font-size: 15px; flex: none; }
        .ga-bars .n { width: 84px; flex: none; }
        .ga-bars .tr { flex: 1; height: 8px; border-radius: 99px; background: var(--ds-track, rgba(15,47,46,.1)); overflow: hidden; }
        .ga-bars .tr span { display: block; height: 100%; border-radius: inherit; }
        .ga-bars .v { width: 40px; text-align: right; flex: none; margin-left: 0; }
        .ga-v-tiles { display: grid; gap: 6px; }
        .ga-v-tiles .ga-ring { border-radius: 14px; background: var(--ds-surface-sunken, rgba(15,47,46,.04)); border: 1px solid var(--ds-line, rgba(15,47,46,.08)); padding: 8px 0 7px; }
        .ga-v-tiles .game-ring-label { font-size: 0.66rem; }
        /* Избраният в списъчните видове — по-плътно име, без ореол */
        .ga-legend .ga-ring::before, .ga-bars .ga-ring::before { display: none; }
        .ga-legend .ga-ring[aria-pressed="true"] .n, .ga-bars .ga-ring[aria-pressed="true"] .n { font-weight: 700; }
        .ga-rings-hint { margin: 6px 0 0; text-align: center; font-size: 0.72rem; color: var(--text-light); }
        /* Изборът на вида — лист отдолу */
        .ga-view-sheet { position: fixed; inset: 0; z-index: 10060; background: rgba(3,20,19,.45); }
        .ga-view-panel { position: absolute; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 520px; box-sizing: border-box; max-height: 86vh; overflow-y: auto; padding: 8px 14px calc(18px + env(safe-area-inset-bottom, 0px));
            border-radius: 24px 24px 0 0; background: var(--ag-surface-solid, var(--bg-color, #fff)); border-top: 1px solid var(--ag-edge, var(--ds-line)); box-shadow: 0 -12px 40px rgba(0,0,0,.25); }
        .ga-view-panel h3 { margin: 8px 2px 10px; font-size: 1.05rem; color: var(--text-dark); }
        .ga-view-opt { display: block; width: 100%; margin: 0 0 10px; padding: 10px; border-radius: 16px; border: 1.5px solid var(--ds-line, rgba(15,47,46,.1));
            background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
        .ga-view-opt[aria-pressed="true"] { border-color: var(--ds-green-text, #03939C); }
        .ga-view-opt > span { display: block; margin: 0 0 8px 2px; font-size: 0.8rem; font-weight: 700; color: var(--text-light); }
        .ga-view-opt .ga-view-prev { pointer-events: none; }
        .ga-ring { position: relative; min-height: 44px; padding: 6px 0 8px; border: 0; background: none; color: inherit; font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        .ga-ring > * { position: relative; }
        /* Избраният — тих ореол в цвета на показателя зад кръга, като светенето на завършените
           части на деня в плана (ambient-glass.css → .dc-seg--done): една мека светлина, без рамка. */
        .ga-ring::before { content: ''; position: absolute; left: 50%; top: 6px; width: 48px; height: 48px; margin-left: -24px; border-radius: 50%;
            background: var(--rc); opacity: 0; filter: blur(10px); transition: opacity .3s ease; pointer-events: none; }
        .ga-ring[aria-pressed="true"]::before { opacity: .3; }
        .ga-ring[aria-pressed="true"] .game-ring-label { color: var(--text-dark); font-weight: 700; }
        @media (prefers-reduced-motion: reduce) { .ga-ring::before { transition: none; } }
        .ga-ring.is-few svg { opacity: .45; }
        .ga-ring:focus-visible { outline: 2px solid var(--ds-green-text, #03939C); outline-offset: 2px; }
        #gameMetricsDetails { flex-direction: column; }
        /* История: 8 седмици като стълбчета */
        .ga-hist { display: flex; align-items: stretch; gap: 6px; height: 150px; margin: 16px 0 6px; }
        .ga-hist-col { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; }
        .ga-hist-bar { width: 100%; max-width: 22px; border-radius: 6px 6px 3px 3px; opacity: .55; }
        .ga-hist-col.is-now .ga-hist-bar { opacity: 1; }
        .ga-hist-bar.is-none { background: var(--ds-track, rgba(15,47,46,.12)) !important; }
        .ga-hist-v { font-size: 0.68rem; font-weight: 700; color: var(--text-dark); font-variant-numeric: tabular-nums; }
        .ga-hist-d { font-size: 0.66rem; color: var(--text-light); white-space: nowrap; }
        .ga-hist-col.is-now .ga-hist-d { color: var(--ds-green-text, #03939C); font-weight: 700; }
        .ga-hist-btn { margin-top: 8px; }
        /* Седмицата в един ред: число + думи (същата мярка като плана и наградите) */
        .ga-week-line { display: flex; align-items: baseline; gap: 8px; margin: 2px 2px 14px; }
        .ga-week-line b { font-size: 2.2rem; line-height: 1; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--ds-green-text, #03939C); }
        .ga-week-line span { font-size: 0.95rem; color: var(--text-light); }
        .game-day-col[data-tip] { cursor: pointer; -webkit-tap-highlight-color: transparent; }
        .game-day-col.is-tip span { color: var(--text-dark); font-weight: 700; }
        .game-day-tip { position: fixed; z-index: 10002; max-width: 240px; padding: 8px 12px; border-radius: 10px; background: var(--text-dark, #0F2F2E); color: var(--bg-color, #fff);
            font-size: 0.82rem; font-weight: 600; line-height: 1.35; box-shadow: 0 6px 20px rgba(0,0,0,.25); pointer-events: none; animation: gaTipIn .14s ease-out; }
        .game-day-tip::after { content: ''; position: absolute; left: var(--arrow-x, 50%); bottom: -6px; transform: translateX(-50%); border: 6px solid transparent; border-bottom: 0; border-top-color: var(--text-dark, #0F2F2E); }
        .game-day-tip.is-below::after { bottom: auto; top: -6px; border: 6px solid transparent; border-top: 0; border-bottom-color: var(--text-dark, #0F2F2E); }
        @keyframes gaTipIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
        .game-ring-bg  { fill: none; stroke: rgba(3,147,156,0.12); }
        .game-ring-fg  { fill: none; stroke-linecap: round; transition: stroke-dashoffset 0.8s cubic-bezier(0.4,0,0.2,1); }
        .game-ring-label { font-size: 0.75rem; font-weight: 600; color: var(--text-light); text-align: center; }
        /* Index rows */
        /* Всеки показател — своя лека карта: фин оттенък, тънка рамка и отстояние, за да не
           се смесва с съседния (DESIGN_PRINCIPLES.md → „Карти и разделения“). */
        .game-index-row {
            margin-bottom: 10px;
            cursor: pointer;
            border-radius: 16px;
            padding: 12px 14px 10px;
            background: var(--ds-surface-sunken, #F6FAF8);
            border: 1px solid var(--ds-line, rgba(15, 47, 46, 0.07));
            transition: background 0.2s, border-color 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .game-index-row:last-child { margin-bottom: 0; }
        .game-index-row:hover { border-color: rgba(3,147,156,0.22); }
        .game-index-row:active { background: rgba(3,147,156,0.06); }
        .game-index-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 5px;
        }
        /* Показателите (вариант C): иконата в тониран квадрат и нивото като етикет. */
        .ga-mname { display: inline-flex; align-items: center; gap: 8px; }
        .ga-mi { width: 18px; text-align: center; font-size: 15px; flex: none; }
        .ga-lvl { font-size: 0.8125rem; font-weight: 700; }
        .game-index-hint {
            font-size: 0.75rem;
            color: var(--text-light, #6b7280);
            margin-bottom: 4px;
        }
        .game-index-bar-wrap {
            height: 8px;
            background: var(--ds-track, rgba(15, 47, 46, 0.09));
            border-radius: 999px;
            overflow: hidden;
        }
        .game-act-wrap { position: relative; }
        .game-act-target { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--text-dark, #1f2937); opacity: 0.45; border-radius: 1px; }
        .game-index-bar {
            height: 100%;
            border-radius: 999px;
            transition: width 0.7s cubic-bezier(0.4,0,0.2,1);
        }
        /* Day-by-day mini bar chart */
        .game-day-dots { display:flex; gap:3px; margin-top:6px; align-items:flex-end; height:52px; }
        .game-day-col  { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:2px; min-width:0; }
        .game-day-dot  {
            width: 100%;
            max-width: 20px;
            border-radius: 3px 3px 0 0;
            min-height: 4px;
            transition: height 0.5s ease;
        }
        /* Calorie target bar chart */
        .game-day-dots-cal {
            display:flex; gap:3px; margin-top:6px; height:52px;
            position:relative; align-items:flex-end;
        }
        .game-cal-target-line {
            position:absolute; left:0; right:0; height:2px;
            background:rgba(107,114,128,0.5);
            border-radius:999px; pointer-events:none; z-index:1;
        }
        [data-theme="dark"] .game-cal-target-line { background:rgba(200,200,200,0.28); }
        /* Correlation insights */
        .game-insight-card {
            background: rgba(3,147,156,0.06);
            border-radius: 12px;
            padding: 10px 13px;
            margin-bottom: 10px;
            border-left: 3px solid #03939C;

        // Apply color scheme from admin settings
        (function() {
            const colorSchemes = {
                'purple-pink': {
                    light: { '--primary-red': '#05737D', '--soft-red': '#CDF9F6' },
                    dark:  { '--primary-red': '#19D6D2', '--soft-red': '#034E5C' }
                },
                'green-blue': {
                    light: { '--primary-red': '#2E7D32', '--soft-red': '#E8F5E9' },
                    dark:  { '--primary-red': '#66BB6A', '--soft-red': '#1B5E20' }
                },
                'blue-indigo': {
                    light: { '--primary-red': '#1D4ED8', '--soft-red': '#EFF6FF' },
                    dark:  { '--primary-red': '#60A5FA', '--soft-red': '#1E3A8A' }
                },
                'orange-red': {
                    light: { '--primary-red': '#C2410C', '--soft-red': '#FFF7ED' },
                    dark:  { '--primary-red': '#FB923C', '--soft-red': '#7C2D12' }
                }
            };
            function applyColorScheme() {
                const savedScheme = localStorage.getItem('colorScheme') || 'purple-pink';
                const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
                const colors = colorSchemes[savedScheme]?.[currentTheme];
                if (colors) {
                    const root = document.documentElement;
                    Object.keys(colors).forEach(key => { root.style.setProperty(key, colors[key]); });
                }
            }
            window.applyGameAnalyticsColorScheme = applyColorScheme;
            applyColorScheme();
            const observer = new MutationObserver((mutations) => {
                mutations.forEach((mutation) => {
                    if (mutation.type === 'attributes' && mutation.attributeName === 'data-theme') {
                        applyColorScheme();
                    }
                });
            });
            observer.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
        })();
    </script>

    <script>
        function setThemeColor(theme) {
            var c = theme === 'dark' ? '#0A1A1A' : '#EDF5F0';
            document.querySelectorAll('meta[name="theme-color"]').forEach(function(m){m.setAttribute('content',c);});
                if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) {
                    var navBar = (window.Capacitor.Plugins || {}).NavigationBar;
                    if (navBar && navBar.setNavigationBarColor) {
                        navBar.setNavigationBarColor({ color: c });
                    }
                }
            }
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
            setThemeColor(newTheme);
            if (document.documentElement.getAttribute('data-embedded-tab') === '1' && window.parent && window.parent !== window) {
                window.parent.postMessage({ type: 'NUTRIPLAN_THEME_CHANGE', theme: newTheme }, window.location.origin);
            }
        }
        function updateThemeIcon(theme) {
            const icon = document.getElementById('themeIcon');
            if (icon) {
                icon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
            }
        }
        function goBack() {
            if (document.documentElement.getAttribute('data-embedded-tab') === '1' && window.parent && window.parent !== window) {
                window.parent.postMessage({ type: 'NUTRIPLAN_SWITCH_TAB', tab: 'plan' }, window.location.origin);
                return;
            }
            if (document.referrer && document.referrer.includes(window.location.hostname)) {
                window.history.back();
            } else {
                window.location.href = 'index.html?app=1&tab=plan';
            }
        }
        // Apply correct icon on load
        (function() {
            var t = document.documentElement.getAttribute('data-theme') || 'light';
            updateThemeIcon(t);
        })();

        var _gfFetched = false;
        function gfEsc(v) {
