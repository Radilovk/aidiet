            var yd0 = new Date(); yd0.setDate(yd0.getDate() - 1);
            var weekEndKey = todayClosed ? todayKey : GS.dateKey(yd0);
            var days = GS.buildLast7Days(allData, weekEndKey);
            var starDays = GS.buildLast7Days(allData, todayKey);
            // Дните преди първия запис не са „пропуснати“ — клиентът още не е започнал.
            var firstKey = Object.keys(allData).filter(function(k){ return /^\d{4}-\d{2}-\d{2}$/.test(k) && allData[k]; }).sort()[0] || null;
            if (!firstKey) {
                body.innerHTML = '<div class="game-encourage-note ga-card-enter"><i class="fas fa-seedling" style="color:#03939C"></i> Анализът започва с първия отбелязан ден. Отбелязвай храненията и отговаряй на сутрешния и вечерния въпрос — тук ще видиш навиците, калорийния баланс и тенденцията.</div>';
                if (badge) badge.textContent = '';
                window._gaChecks = {};
                renderGoalFocus();
                return;
            }
            // Същите формули като на сървъра (решенията за плана се вземат там).
            var summary = GS.weekSummary(allData, todayKey, weekEndKey);
            var waterGoalText = (function(){
                try {
                    var st = (JSON.parse(localStorage.getItem('dietPlan') || '{}').strategy) || {};
                    var m = String(st.hydrationStrategy || '').match(/(\d+(?:[.,]\d+)?)\s*л/);
                    return m ? m[1].replace('.', ',') + ' л' : '2 л';
                } catch (_) { return '2 л'; }
            })();

            // ── Core metrics ──────────────────────────────────────────────────
            var weekScores = days.map(function(d){ return d.rec ? calcDayScore(d.rec) : null; });
            var validScores= weekScores.filter(function(s){ return s&&s.score!=null; });
            var avgScore   = validScores.length>0 ? Math.round(validScores.reduce(function(a,s){return a+s.score;},0)/validScores.length*10)/10 : 0;

            // Спазване на плана за деня (GameScoring.dayAdherence) — тежестите по целта, движението по правилото за целта.
            // Личните тежести — кое колко е важно за този човек (goal-focus.js → adherenceWeights).
            var ADH_GROUP = 'base', ADH_POL = null, ADH_W = null;
            try {
                var udA = JSON.parse(localStorage.getItem('userData') || '{}');
                var GFa = window.NutriPlanGoalFocus;
                if (GFa) { ADH_GROUP = GFa.profileOf(udA).group; ADH_POL = GFa.activityPolicy(udA); if (GFa.adherenceWeights) ADH_W = GFa.adherenceWeights(udA, allData, todayKey); }
            } catch (_) {}
            window._gaAdhW = ADH_W;
            var adhOf = function(d){ return d.rec ? GS.dayAdherence(d.rec, { todayKey: todayKey, key: d.key, group: ADH_GROUP, policy: ADH_POL, weights: ADH_W && ADH_W.weights }).pct : null; };
            var engPcts = days.map(adhOf);
            var noDataDaysCount = days.filter(function(d){ return !d.rec && d.key >= firstKey && d.key < todayKey; }).length;
            var engForAvg = days.filter(function(d){ return d.rec; }).map(function(d){ return calcDayScore(d.rec).engPct; });
            var engagementPct = engForAvg.length
                ? Math.round(engForAvg.reduce(function(a,b){return a+b;},0) / engForAvg.length)
                : 0;

            var extraCalsByDay = days.map(function(d){
                if(!d.rec||!d.rec.extraMeals) return null;
                return d.rec.extraMeals.reduce(function(s,em){
                    if (em.isAddedToPlan && !em.countCalories) return s;
                    return s+(em.calories||0);
                },0);
            });
            var totalExtraCals = extraCalsByDay.reduce(function(s,v){return s+(v||0);},0);

            // Само завършени дни с поне половината хранения отметнати (както сумата).
            var calBalanceByDay = days.map(function(d){
                if (!GS.calorieDayCounts(d, todayKey)) return null;
                return calcDayScore(d.rec).calorieDelta;
            });
            var netCalBalance = summary.netCalBalance;

            var calConsumedByDay = days.map(function(d){
                if (!d.rec) return null;
                var mealCalMap = d.rec.mealCalories || {};
                var dayFreeMeal = (d.rec.freeMeal && d.rec.freeMeal.calories > 0) ? d.rec.freeMeal : null;
                var completedCals = Object.keys(d.rec.meals || {}).reduce(function(sum, mt){
                    if (!d.rec.meals[mt]) return sum;
                    if (dayFreeMeal && dayFreeMeal.mealKey === mt) return sum + dayFreeMeal.calories;
                    return sum + (mealCalMap[mt] || 0);
                }, 0);
                var extraCals = (d.rec.extraMeals || []).reduce(function(sum, em){
                    if (em.isAddedToPlan && !em.countCalories) return sum;
                    return sum + (em.calories || 0);
                }, 0);
                var total = completedCals + extraCals;
                return total > 0 ? total : null;
            });
            var calPlannedByDay = days.map(function(d){
                return d.rec ? (GS.getPlannedCalories(d.rec) || null) : null;
            });
            var calAdherencePct = summary.calAdherence;

            var balanceByDay = days.map(function(d){
                if(!d.rec||!d.rec.eveningCheck||d.rec.eveningCheck.emotionalBalance==null) return null;
                return Math.round((d.rec.eveningCheck.emotionalBalance-1)/2*100);
            });
            var balanceValid = balanceByDay.filter(function(v){return v!==null;});
            var balancePct = balanceValid.length>0 ? Math.round(balanceValid.reduce(function(a,b){return a+b;},0)/balanceValid.length) : null;

            // Сънят: добър 100 / среден 50 / лош 0 (средният — от гривна/телефон при 6–7 ч).
            var sleepByDay = days.map(function(d){
                if(!d.rec||!d.rec.morningCheck||d.rec.morningCheck.sleptWell==null) return null;
                var lv = d.rec.morningCheck.level;
                return lv==='mid' ? 50 : lv==='bad' ? 0 : lv==='good' ? 100 : (d.rec.morningCheck.sleptWell ? 100 : 0);
            });
            var sleepValid = sleepByDay.filter(function(v){return v!==null;});
            var sleepPct = sleepValid.length>0 ? Math.round(sleepValid.reduce(function(a,b){return a+b;},0)/sleepValid.length) : null;

            // Измерено (крачки + тренировката спрямо целта по профила) или отговорът 1–3 (game-scoring.js).
            var actByDay = days.map(function(d){ return GameScoring.activityPctOf(d.rec&&d.rec.eveningCheck); });
            var actValid = actByDay.filter(function(v){return v!==null;});
            var actPct = actValid.length>0 ? Math.round(actValid.reduce(function(a,b){return a+b;},0)/actValid.length) : null;
            // Показването е без горна граница: 160% е „над целта“, а не 100%. Индексът и звездите остават до 100%.
            var actRawByDay = days.map(function(d){ return GameScoring.activityRawPctOf(d.rec&&d.rec.eveningCheck); });
            var actRawValid = actRawByDay.filter(function(v){return v!==null;});
            var actRawPct = actRawValid.length>0 ? Math.round(actRawValid.reduce(function(a,b){return a+b;},0)/actRawValid.length) : null;
            var actOverDays = days.filter(function(d){ return GameScoring.extraBurnKcal(d.rec&&d.rec.eveningCheck)>0; }).length;
            var actExtraBurn = days.reduce(function(s,d){ return s + GameScoring.extraBurnKcal(d.rec&&d.rec.eveningCheck); },0);
            var actMeasured = days.map(function(d){ return d.rec&&d.rec.eveningCheck; })
                .filter(function(e){ return e&&e.equivSteps>0&&e.stepTarget>0; });
            var actStepsAvg = actMeasured.length ? Math.round(actMeasured.reduce(function(a,e){ return a+(e.steps||0); },0)/actMeasured.length/100)*100 : null;
            var actTarget = actMeasured.length ? actMeasured[actMeasured.length-1].stepTarget : null;
            var actAnswered = actValid.length - actMeasured.length;
            var fmtSteps = function(n){ return Number(n).toLocaleString('bg-BG'); };

            var waterByDay = days.map(function(d){
                if(!d.rec||!d.rec.eveningCheck||d.rec.eveningCheck.waterIntake==null) return null;
                return d.rec.eveningCheck.waterIntake===true ? 100 : 0;
            });
            var waterValid = waterByDay.filter(function(v){return v!==null;});
            var waterPct = waterValid.length>0 ? Math.round(waterValid.reduce(function(a,b){return a+b;},0)/waterValid.length) : null;
            // ── Седмицата: всеки показател — сборът за дните, разделен на ВСИЧКИ дни от седмицата
            // (от първия отбелязан ден нататък). Ден без отговор е 0: седмичният процент е седмица,
            // не средно от двата-трите дни с отговор. Същата сметка — и за историята (минали седмици).
            function weekMetrics(endKey) {
                var wd = GS.buildLast7Days(allData, endKey).filter(function(d){ return d.key >= firstKey; });
                var n = wd.length;
                var m = { n: n, eng: 0, cal: 0, act: 0, actRaw: 0, sleep: 0, mood: 0, water: 0, has: {} };
                if (!n) return null;
                wd.forEach(function(d){
                    var r = d.rec; if (!r) return;
                    var mc = r.morningCheck, ec = r.eveningCheck;
                    m.eng += GS.dayAdherence(r, { todayKey: todayKey, key: d.key, group: ADH_GROUP, policy: ADH_POL, weights: ADH_W && ADH_W.weights }).pct || 0; m.has.eng = 1;
                    var cc = GS.dayCalCloseness(r); if (cc != null) { m.cal += cc; m.has.cal = 1; }
                    var a = GameScoring.activityPctOf(ec), ar = GameScoring.activityRawPctOf(ec);
                    if (a != null) { m.act += a; m.actRaw += ar; m.has.act = 1; }
                    if (mc && mc.sleptWell != null) { m.sleep += mc.level === 'mid' ? 50 : mc.level === 'bad' ? 0 : mc.level === 'good' ? 100 : (mc.sleptWell ? 100 : 0); m.has.sleep = 1; }
                    if (ec && ec.emotionalBalance != null) { m.mood += Math.round((ec.emotionalBalance - 1) / 2 * 100); m.has.mood = 1; }
                    if (ec && ec.waterIntake != null) { m.water += ec.waterIntake === true ? 100 : 0; m.has.water = 1; }
                });
                var out = {};
                ['eng', 'cal', 'act', 'actRaw', 'sleep', 'mood', 'water'].forEach(function(k){
                    var hk = k === 'actRaw' ? 'act' : k;
                    out[k] = m.has[hk] ? Math.round(m[k] / n) : null;
                });
                return out;
            }
            // Предупрежденията и насърчението — по дните С отговор (липсващ отговор не е лош сън или жажда).
            var ANS = { sleep: sleepPct, mood: balancePct, water: waterPct };
            var WM = weekMetrics(weekEndKey) || {};
            engagementPct = WM.eng || 0;
            calAdherencePct = WM.cal; actPct = WM.act; actRawPct = WM.actRaw;
            sleepPct = WM.sleep; balancePct = WM.mood; waterPct = WM.water;
            // Стойността за деня (балончето над стълбчето) — само нивото. Емоциите — със думите от вечерния въпрос.
            // Вариант C: всеки показател — свой оттенък (design-system.css → --ds-metric-*).
            var MC = {
                act:   { c: 'var(--ds-metric-activity)', t: 'var(--ds-metric-activity-text)', icon: 'fa-person-walking' },
                sleep: { c: 'var(--ds-metric-sleep)',    t: 'var(--ds-metric-sleep-text)',    icon: 'fa-moon' },
                mood:  { c: 'var(--ds-metric-mood)',     t: 'var(--ds-metric-mood-text)',     icon: 'fa-face-smile' },
                water: { c: 'var(--ds-metric-water)',    t: 'var(--ds-metric-water-text)',    icon: 'fa-droplet' }
            };
            // Без тонирани фонове: иконата е в цвета на показателя, нивото — в по-тъмния му тон.
            var metricName = function(m, name){ return '<span class="ga-mname"><i class="fas '+m.icon+' ga-mi" style="color:'+m.c+'"></i>'+name+'</span>'; };
            var metricLevel = function(m, text){ return '<span class="ga-lvl" style="color:'+m.t+'">'+text+'</span> <i class="fas fa-circle-info"></i>'; };
            var moodLabel = function(v){ return v>=70 ? 'Позитивно' : v>=40 ? 'Спокойно' : 'Напрегнато'; };
            var levelLabel = function(v, female){ return v>=70 ? (female?'Добра':'Добър') : v>=40 ? (female?'Средна':'Среден') : (female?'Лоша':'Лош'); };
            // Активността: пет нива спрямо целта за деня (крачки + тренировката).
            var actLevel = function(v){ return v>=130 ? 'Много висока' : v>=90 ? 'Висока' : v>=60 ? 'Средна' : v>=30 ? 'Ниска' : 'Много ниска'; };
            var balanceTips = balanceByDay.map(function(v){ return v==null ? 'Няма данни' : moodLabel(v); });
            var sleepTips = sleepByDay.map(function(v){ return v==null ? 'Няма данни' : levelLabel(v); });
            var waterTips = waterByDay.map(function(v){ return v==null ? 'Няма данни' : levelLabel(v, true); });
            var actTips = days.map(function(d, i){
                var e = d.rec && d.rec.eveningCheck; var v = actRawByDay[i];
                if (v == null) return 'Няма данни';
                return actLevel(v) + (e && (e.trained === 'am' || e.trained === 'pm') ? ' · тренировка' : '');
            });

            var junkCount7=0;
            days.forEach(function(d){ ((d.rec&&d.rec.extraMeals)||[]).forEach(function(em){
                var isConsumed = !em.isAddedToPlan || em.countCalories !== false;
                if(em.isJunk && isConsumed) junkCount7++;
            }); });

            var pastScores = weekScores.slice(0, weekScores.length - 1);
            var firstHalf = pastScores.slice(0,Math.floor(pastScores.length/2)).filter(function(s){ return s&&s.score!=null; });
            var lastHalf  = pastScores.slice(Math.ceil(pastScores.length/2)).filter(function(s){ return s&&s.score!=null; });
            var trendUp   = lastHalf.length>1&&firstHalf.length>1 &&
                (lastHalf.reduce(function(a,s){return a+s.score;},0)/lastHalf.length) >
                (firstHalf.reduce(function(a,s){return a+s.score;},0)/firstHalf.length + 0.3);
            var trendDown = lastHalf.length>1&&firstHalf.length>1 &&
                (firstHalf.reduce(function(a,s){return a+s.score;},0)/firstHalf.length) >
                (lastHalf.reduce(function(a,s){return a+s.score;},0)/lastHalf.length + 0.3);

            var healthScore = summary.healthIndex;
            var mealAdherencePct = summary.mealAdherence;

            // ── Correlation insights ──────────────────────────────────────────
            var insights = [];
            var sleepGoodEng=[], sleepBadEng=[];
            days.forEach(function(d,i){
                if(sleepByDay[i]!=null&&engPcts[i]!=null){
                    if(sleepByDay[i]===100) sleepGoodEng.push(engPcts[i]);
                    else sleepBadEng.push(engPcts[i]);
                }
            });
            if(sleepGoodEng.length>1&&sleepBadEng.length>1){
                var sgAvg=Math.round(sleepGoodEng.reduce(function(a,b){return a+b;},0)/sleepGoodEng.length);
                var sbAvg=Math.round(sleepBadEng.reduce(function(a,b){return a+b;},0)/sleepBadEng.length);
                if(sgAvg-sbAvg>15) insights.push('<i class="fas fa-bed" style="color:#6366f1"></i> В дните с добър сън ангажираността ти е <strong>по-висока</strong>, отколкото след лош сън');
            }
            var lowBalanceDays  = days.filter(function(d,i){ return balanceByDay[i]!=null&&balanceByDay[i]<=40; });
            var highBalanceDays = days.filter(function(d,i){ return balanceByDay[i]!=null&&balanceByDay[i]>=60; });
            var lbJunk = lowBalanceDays.reduce(function(s,d){return s+((d.rec&&d.rec.extraMeals||[]).filter(function(e){
                var isConsumed = !e.isAddedToPlan || e.countCalories !== false;
                return e.isJunk && isConsumed;
            }).length);},0);
            var hbJunk = highBalanceDays.reduce(function(s,d){return s+((d.rec&&d.rec.extraMeals||[]).filter(function(e){
                var isConsumed = !e.isAddedToPlan || e.countCalories !== false;
                return e.isJunk && isConsumed;
            }).length);},0);
            // Връзка се твърди само при поне 2 случая и по-висока честота на ден — един случай е съвпадение.
            if(lbJunk>=2&&highBalanceDays.length>0&&lbJunk/lowBalanceDays.length>hbJunk/highBalanceDays.length) insights.push('<i class="fas fa-heart-pulse" style="color:#f59e0b"></i> В напрегнатите дни вредните хранения са по-чести');
            var streak=0, currentStreak=0;
            var streakStart = days.length - 1;
            if (streakStart >= 0 && days[streakStart].key === todayKey &&
                    (!days[streakStart].rec || calcDayScore(days[streakStart].rec).score === null)) {
                streakStart--;
            }
            for(var si=streakStart;si>=0;si--){
                if(days[si].rec&&calcDayScore(days[si].rec).score>=4){ streak++; currentStreak=Math.max(currentStreak,streak); } else break;
            }
            // Поредицата е една и живее в „Пътят към успеха“ — тук не се повтаря.
            var deficitDays = days.filter(function(d,i){
                return calBalanceByDay[i]!==null && calBalanceByDay[i]<-100 && d.rec && (d.rec.morningCheck||d.rec.eveningCheck);
            });
            if(deficitDays.length>=2){
                insights.push('<i class="fas fa-arrow-down" style="color:#3b82f6"></i> Няколко дни с прием под плана — планът вече включва нужния дефицит; по-малко от него забавя, не ускорява');
            } else if(deficitDays.length===1){
                insights.push('<i class="fas fa-arrow-down" style="color:#3b82f6"></i> Един ден с прием под плана — планът вече включва нужния дефицит');
            }
            if(deficitDays.length>=2){
                // Сравнение с останалите дни: без него „по-ниска“ няма спрямо какво.
                var lowActOf=function(list){ return list.filter(function(d){ return d.rec&&GameScoring.isLowActivity(d.rec.eveningCheck); }).length; };
                var otherDays=days.filter(function(d){ return d.rec&&d.rec.eveningCheck&&deficitDays.indexOf(d)<0; });
                var deficitLowAct=lowActOf(deficitDays);
                if(deficitLowAct>=2&&otherDays.length>=2&&deficitLowAct/deficitDays.length>lowActOf(otherDays)/otherDays.length) insights.push('<i class="fas fa-bolt" style="color:#3b82f6"></i> В дните с прием под плана активността ти е по-ниска — по-малкото храна личи в енергията');
            }

            // ── Alerts ────────────────────────────────────────────────────────
            var alerts = [];
            var missedLast2 = days.slice(-2).filter(function(d){
                if (d.key < firstKey) return false;
                if (!d.rec) return d.key !== todayKey;
                var s = calcDayScore(d.rec);
                return adhOf(d) != null && adhOf(d) < 35;   // по личното спазване на деня
            });
            if(missedLast2.length>=2) alerts.push('<i class="fas fa-triangle-exclamation" style="color:#f59e0b"></i> Последните 2 дни имаш ниска ангажираност — провери дали имаш нужда от промяна в плана.');
            // Движение над препоръчаното за целта (кърмене, бременност, покачване) — предупреждение, не награда.
            try {
                var POLa = window.NutriPlanGoalFocus && window.NutriPlanGoalFocus.activityPolicy(JSON.parse(localStorage.getItem('userData') || '{}'));
                if (POLa && POLa.maxPct) {
                    var tooMuchDays = days.filter(function(d){ var r = GameScoring.activityRawPctOf(d.rec && d.rec.eveningCheck); return r != null && r >= POLa.maxPct; }).length;
                    if (tooMuchDays >= 1) alerts.unshift('<i class="fas fa-triangle-exclamation" style="color:#f59e0b"></i> Движението ' + (tooMuchDays === 1 ? 'в един ден' : 'в ' + tooMuchDays + ' дни') + ' е над препоръчаното за целта ти. Повече не е по-добре — тези дни не носят награда.');
                }
            } catch (_) {}
            if(junkCount7>=4) alerts.push('<i class="fas fa-circle-exclamation" style="color:#ef4444"></i> Тази седмица има доста вредни хранения. Опитай да ги намалиш до едно-две.');
            if(ANS.water!=null&&ANS.water<40) alerts.push('<i class="fas fa-droplet" style="color:#06B6D4"></i> Хидратацията ти е ниска тази седмица — достатъчният прием на вода подпомага метаболизма и енергията.');
            if(ANS.sleep!=null&&ANS.sleep<30) alerts.push('<i class="fas fa-triangle-exclamation" style="color:#f59e0b"></i> Качеството на съня е ниско тази седмица — това пряко влияе на метаболизма и избора на храна.');

            // ── Encouragement ─────────────────────────────────────────────────
            var leadingCriterion='', encourageText='';   // без обща фраза: фокус има само при конкретна причина
            if      (junkCount7>2)                     { leadingCriterion='Вредни храни'; encourageText='<i class="fas fa-leaf" style="color:#10b981"></i> Намали вредните храни — планът работи когато го следваш!'; }
            else if (ANS.water!=null&&ANS.water<50)      { leadingCriterion='Хидратация'; encourageText='<i class="fas fa-droplet" style="color:#06B6D4"></i> Пий повече вода през деня — целта ти по плана е ' + waterGoalText + '.'; }
            else if (ANS.sleep!=null&&ANS.sleep<50)      { leadingCriterion='Сън';          encourageText='<i class="fas fa-bed" style="color:#6366f1"></i> Добрият сън е основата. Лягай по-рано — тялото ти ще ти благодари!'; }
            else if (engagementPct<60)                 { leadingCriterion='';             encourageText='<i class="fas fa-check-circle" style="color:#10b981"></i> Спазвай храненията по план — резултатите идват!'; }
            else if (ANS.mood!=null&&ANS.mood<40)  { leadingCriterion='Баланс';       encourageText='<i class="fas fa-heart-pulse" style="color:#10b981"></i> Седмицата е напрегната. Няколко минути спокойно дишане или разходка вечер помагат — и не се наказвай за пропуснато хранене.'; }
            else if (engagementPct>=90)                { leadingCriterion='Отлично';      encourageText='<i class="fas fa-trophy" style="color:#fbbf24"></i> Страхотно! Продължавай в същия дух — резултатите идват!'; }
            if (badge) badge.textContent = 'последните 7 дни';

            // ── Explanation modal ─────────────────────────────────────────────
            // Обясненията са без измислени проценти и „изследвания“: само това, което
            // насоките (СЗО, EFSA, ESC) и обзорите наистина казват.
            var EXPLANATIONS = {
                engagement: { title:'Ангажираност към плана',
                    short:'Колко от целия план за деня е спазен: хранения, калории, движение, сън, вода и емоции. Кое колко тежи — по твоята цел, профил и последните 2 седмици. Докосни ден, за да видиш какво го е свалило.',
                    text:'Как се смята:\n• храненията — всяко тежи колкото дела си от калориите (пропусната вечеря сваля повече от пропусната междинна закуска);\n• калориите — изяденото, вкл. допълнителните хранения, спрямо плана (±10% е пълно);\n• без хранения извън плана;\n• движението спрямо дневната цел (или тренировка);\n• сънят, водата и емоциите — по отговорите.\nБез отговор частта е 0. Седмицата е средното за 7-те дни.\n\nЦел: минимум 85%.',
                    why:'Постоянството е най-силният предиктор за резултат при всяка диета — по-важно от вида на диетата. Затова планът се настройва по това, което реално спазваш.' },
                calories: { title:'Калориен баланс',
                    text:'Сумата на разликата между изядено и планирано за завършените дни, в които са отметнати поне половината хранения. Неотметнатото хранене не се брои като неизядено, а днешният ден — едва когато свърши.\n\nЛентата показва колко близо си до плана (100% = точно; 10% над или под = 90%).',
                    why:'Теглото следва енергийния баланс за седмици, не за един ден — затова гледаме седмицата, а корекциите се правят по реалното тегло.' },
                stress: { title:'Емоции',
                    text:'Как си се чувствал/а през деня — по вечерния въпрос: Позитивно, Спокойно или Напрегнато. За седмицата: от 70% — Позитивно, от 40% — Спокойно, под 40% — Напрегнато.\n\nЦел: минимум 70%.',
                    why:'Напрежението и умората често водят до хранене „по емоция“ и избор на по-калорични храни. Да го забелязваш е първата стъпка да го управляваш.' },
                sleep: { title:'Сън',
                    text:'Качеството на съня: Добър, Среден или Лош. С гривна, часовник или телефон, които записват съня, се взима от тях (7+ ч — добър, 6–7 ч — среден, под 6 ч — лош) и сутрешният въпрос не се задава; иначе — от отговора сутрин.\n\nЦел: минимум 70%.',
                    why:'Недоспиването повишава апетита и прави дефицита по-труден за спазване. Препоръката за възрастни е 7–9 часа сън.' },
                activity: { title:'Активност',
                    text: actMeasured.length
                        ? 'Нивата спрямо целта: под 30% — Много ниска, до 60% — Ниска, до 90% — Средна, до 130% — Висока, над това — Много висока.\n\nИзчислява се от крачките (крачкомер на телефона или гривна/часовник): крачките за деня плюс тренировката, превърната в крачки, спрямо твоята цел — ' + fmtSteps(actTarget) + ' крачки на ден. Целта е по целта ти и профила (възраст, тегло, кръвна захар).\n\n' + actMeasured.length + ' ' + (actMeasured.length===1?'ден е измерен':'дни са измерени') + (actAnswered>0 ? ', ' + actAnswered + ' — по отговорите ти вечер (Ниско 0%, Средно 50%, Високо 100%)' : '') + '.\n\nЦел: минимум 70%. Над 100% — повече движение от целта (чертата на лентата); оценката и индексът броят до 100%.'
                        : 'Показва колко активен си бил всеки ден — по отговорите ти вечер (Ниско 0%, Средно 50%, Високо 100%). С включен крачкомер или свързана гривна се смята от реалните крачки спрямо твоята цел.\n\nНивата спрямо целта: под 30% — Много ниска, до 60% — Ниска, до 90% — Средна, до 130% — Висока, над това — Много висока.\n\nЦел: минимум 70%.',
                    why:'СЗО препоръчва поне 150 минути умерена активност седмично. Всяко раздвижване се брои — включително разходката.\n\nПланът вече носи обичайните ти крачки. В ден с крачки над целта и над обичайното разходът е по-голям, а дефицитът — по-дълбок. Калориите на деня не се променят със задна дата: това става ясно вечерта. Седмичният преглед смята разхода по средните ти крачки, така че постоянно по-високата активност се отразява в следващия план. Дните с тренировка не се броят тук — тренировките вече са в плана.' },
                water: { title:'Хидратация',
                    text:'Дали си изпил препоръчаната вода за деня (от вечерните проверки): за деня — Добра или Лоша; за седмицата — Добра (от 70% от дните), Средна (от 40%) или Лоша. Твоята цел по плана: ' + waterGoalText + ' дневно.\n\nЦел: минимум 70% от дните.',
                    why:'Водата помага за ситостта и храносмилането; нуждите растат при жега и тренировки.' },
                health: { title:'Индекс на навиците',
                    text:'Обобщена оценка на навиците ти тази седмица — ангажираност, сън, хидратация, активност, емоции и извънпланови калории. Не е медицинска оценка.\n\nЦел: минимум 70.',
                    why:'Добрите навици се подсилват взаимно: по-добрият сън и по-малкото напрежение улесняват спазването на плана.' }
            };
            // „Назад“ на Android и Escape затварят най-горното обяснение.
            window.NutriPlanHandleBack = function () {
                var open = document.querySelectorAll('.game-explain-overlay');
                if (!open.length) return false;
                open[open.length - 1].remove();
                return true;
            };
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') window.NutriPlanHandleBack();
            });
            var gaNumbers = {};
            // Балонче със стойността за деня — над стълбчето, със стрелка; затваря се с докосване другаде.
            function hideDayTip() { var t = document.getElementById('gameDayTip'); if (t) t.remove(); document.querySelectorAll('.game-day-col.is-tip').forEach(function(c){ c.classList.remove('is-tip'); }); }
            function showDayTip(col) {
                var same = col.classList.contains('is-tip');
                hideDayTip();
                if (same) return;
                var tip = document.createElement('div');
                tip.id = 'gameDayTip'; tip.className = 'game-day-tip'; tip.setAttribute('role', 'status');
                tip.textContent = col.getAttribute('data-tip');
                document.body.appendChild(tip);
                col.classList.add('is-tip');
                var r = col.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
                var left = Math.max(8, Math.min(window.innerWidth - w - 8, r.left + r.width / 2 - w / 2));
                var top = r.top - h - 10;
                var below = top < 8;
                if (below) top = r.bottom + 10;
                tip.style.left = left + 'px'; tip.style.top = top + 'px';
                tip.style.setProperty('--arrow-x', (r.left + r.width / 2 - left) + 'px');
                if (below) tip.classList.add('is-below');
            }
            if (!window._gaDayTipBound) {
                window._gaDayTipBound = true;
                document.addEventListener('click', function(e){ if (!e.target.closest('.game-day-col[data-tip]')) hideDayTip(); });
                window.addEventListener('scroll', hideDayTip, { passive: true });
            }
            // Обяснението: заглавие и кратко обобщение; подробностите — разгъващи се; съдържанието се
            // превърта, бутоните остават долу (никога по-високо от екрана).
            function showExplanation(key) {
                var info = EXPLANATIONS[key]; if(!info) return;
                var old = document.getElementById('gameExplainOverlay'); if(old) old.remove();
                var overlay = document.createElement('div');
                overlay.id = 'gameExplainOverlay'; overlay.className = 'game-explain-overlay';
                overlay.addEventListener('click', function(e){ if(e.target===overlay) overlay.remove(); });
                var box = document.createElement('div'); box.className = 'game-explain-box';
                var t = document.createElement('div'); t.className='game-explain-title'; t.textContent=info.title;
                var scroll = document.createElement('div'); scroll.className = 'ge-scroll';
                var paras = String(info.text || '').split('\n\n');
                var short = info.short || paras[0];
                var rest = info.short ? paras : paras.slice(1);
                // Всеки ред — отделен елемент: така речникът на превода (i18n.js) хваща всеки ред поотделно.
                var setLines = function (el, text) {
                    String(text || '').split('\n').forEach(function (ln) {
                        var d = document.createElement('div');
                        if (ln.trim()) d.textContent = ln; else d.style.height = '8px';
                        el.appendChild(d);
                    });
                };
                var sm = document.createElement('div'); sm.className='game-explain-text'; setLines(sm, short);
                scroll.appendChild(sm);
                if(gaNumbers[key]) {
                    var nm = document.createElement('div'); nm.className='game-explain-text'; nm.style.cssText='margin-top:8px;font-weight:600';
                    setLines(nm, gaNumbers[key]);
                    scroll.appendChild(nm);
                }
                var more = rest.length ? rest.join('\n\n') : '';
                var reasons = key === 'engagement' && window._gaAdhW && window._gaAdhW.reasons.length ? window._gaAdhW.reasons.slice(0, 4) : [];
                if (more || reasons.length) {
                    var det = document.createElement('details'); det.className = 'ge-more';
                    var su = document.createElement('summary'); su.textContent = 'Подробно';
                    var dt = document.createElement('div'); dt.className='game-explain-text'; setLines(dt, more);
                    if (reasons.length) {
                        // „За теб тежат повече“: частта, причината и тежестта — отделни парчета (превеждат се поотделно)
                        var NM = { meal: 'храненията', cal: 'калориите', junk: 'храненията извън плана', act: 'движението', sleep: 'сънят', water: 'водата', mood: 'емоциите' };
                        if (more) setLines(dt, '');
                        setLines(dt, 'За теб тежат повече:');
                        reasons.forEach(function (r) {
                            var d = document.createElement('div');
                            var a = document.createElement('span'); a.textContent = NM[r.k];
                            var b = document.createElement('span'); b.textContent = r.text;
                            var c = document.createElement('span'); c.textContent = '(' + window._gaAdhW.weights[r.k] + ' от 100)';
                            d.appendChild(document.createTextNode('• ')); d.appendChild(a); d.appendChild(document.createTextNode(' — ')); d.appendChild(b); d.appendChild(document.createTextNode(' ')); d.appendChild(c);
                            dt.appendChild(d);
                        });
                    }
                    det.appendChild(su); det.appendChild(dt); scroll.appendChild(det);
                }
                box.appendChild(t); box.appendChild(scroll);
                var acts = document.createElement('div'); acts.className = 'ge-actions';
                if(info.why) {
                    var whyBtn = document.createElement('button'); whyBtn.className='game-explain-why-btn'; whyBtn.innerHTML='<i class="fas fa-flask"></i> Защо е важно';
                    whyBtn.onclick=function(){ showWhyModal(info.title, info.why); };
                    acts.appendChild(whyBtn);
                }
                if (HIST[key]) {
                    var hb = document.createElement('button'); hb.className='game-explain-why-btn ga-hist-btn'; hb.innerHTML='<i class="fas fa-chart-column"></i> История';
                    hb.onclick=function(){ overlay.remove(); showHistory(key, info.title); };
                    acts.appendChild(hb);
                }
                var cb= document.createElement('button'); cb.className='game-explain-close'; cb.textContent='Разбрах';
                cb.onclick=function(){ overlay.remove(); };
                acts.appendChild(cb);
                box.appendChild(acts);
                overlay.appendChild(box); document.body.appendChild(overlay);
            }

            // ── История: последните 8 седмици (около 2 месеца) — със същата сметка като кръговете (weekMetrics).
            var HIST = {
                engagement: { color: '#03939C', k: 'eng' }, calories: { color: '#F59E0B', k: 'cal' }, activity: { color: MC.act.c, k: 'act' },
                sleep: { color: MC.sleep.c, k: 'sleep' }, stress: { color: MC.mood.c, k: 'mood' }, water: { color: MC.water.c, k: 'water' }
            };
            function showHistory(key, title) {
                var h = HIST[key]; if (!h) return;
                var old = document.getElementById('gameHistOverlay'); if (old) old.remove();
                var weeks = [];
                for (var i = 7; i >= 0; i--) {
                    var end = new Date(weekEndKey + 'T12:00:00'); end.setDate(end.getDate() - i * 7);
                    var endKey = GS.dateKey(end);
                    var wm = weekMetrics(endKey);
                    var v = wm ? wm[h.k] : null;
                    var st = new Date(end); st.setDate(st.getDate() - 6);
                    weeks.push({ v: v == null ? null : Math.round(v), label: st.getDate() + '.' + String(st.getMonth() + 1).padStart(2, '0'), now: i === 0 });
                }
                var vals = weeks.filter(function(w){ return w.v != null; });
                var overlay = document.createElement('div');
                overlay.id = 'gameHistOverlay'; overlay.className = 'game-explain-overlay'; overlay.style.zIndex = '10001';
                overlay.addEventListener('click', function(e){ if (e.target === overlay) overlay.remove(); });
                var box = document.createElement('div'); box.className = 'game-explain-box';
                box.innerHTML = '<div class="game-explain-title"><span>' + title + '</span> <span>· история</span></div>' +
                    '<div class="game-explain-text"><span>Последните 8 седмици</span>' + (vals.length >= 2 ? ' <span>· средно ' + Math.round(vals.reduce(function(a, w){ return a + w.v; }, 0) / vals.length) + '%</span>' : '') + '</div>' +
                    (vals.length ? '<div class="ga-hist" role="img" aria-label="' + title + '">' + weeks.map(function(w){
                        return '<div class="ga-hist-col' + (w.now ? ' is-now' : '') + '"><span class="ga-hist-v">' + (w.v == null ? '' : w.v + '%') + '</span>' +
                            '<span class="ga-hist-bar' + (w.v == null ? ' is-none' : '') + '" style="height:' + (w.v == null ? 3 : Math.max(3, Math.round(w.v * 0.72))) + '%;background:' + h.color + '"></span>' +
                            '<span class="ga-hist-d">' + (w.now ? 'сега' : w.label) + '</span></div>';
                    }).join('') + '</div>' : '<div class="game-explain-text" style="margin-top:12px">Още няма данни за по-ранни седмици.</div>');
                var cb = document.createElement('button'); cb.className = 'game-explain-close'; cb.textContent = 'Затвори';
                cb.onclick = function(){ overlay.remove(); };
                box.appendChild(cb);
                overlay.appendChild(box); document.body.appendChild(overlay);
            }
            function showWhyModal(title, whyText) {
                var old = document.getElementById('gameWhyOverlay'); if(old) old.remove();
                var overlay = document.createElement('div');
                overlay.id = 'gameWhyOverlay'; overlay.className = 'game-explain-overlay'; overlay.style.zIndex='10001';
                overlay.addEventListener('click', function(e){ if(e.target===overlay) overlay.remove(); });
                var box = document.createElement('div'); box.className = 'game-explain-box';
                var t = document.createElement('div'); t.className='game-explain-title'; t.innerHTML='<i class="fas fa-flask" style="color:#6366f1"></i> ' + title;
                var tx = document.createElement('div'); tx.className='game-explain-text'; tx.style.whiteSpace='pre-line'; tx.textContent=whyText;
                var cb = document.createElement('button'); cb.className='game-explain-close'; cb.textContent='Затвори';
                cb.onclick=function(){ overlay.remove(); };
                box.appendChild(t); box.appendChild(tx); box.appendChild(cb);
                overlay.appendChild(box); document.body.appendChild(overlay);
            }

            // ── Render helpers ────────────────────────────────────────────────
            function pBar(pct, color) {
                if (pct==null) return '<span style="font-size:0.75rem;color:var(--text-light)">Няма данни</span>';
                return '<div class="game-index-bar-wrap"><div class="game-index-bar" style="width:0%;background:'+color+'" data-ga-bar="'+Math.min(100,Math.max(0,pct))+'"></div></div>';
            }
            var DAY_NAMES = ['Пн','Вт','Ср','Чт','Пт','Сб','Нд'];
            var BAR_MIN_H = 4;
            var BAR_MAX_H = 36;
            var LABEL_STYLE = 'font-size:0.75rem;color:var(--text-light)';
            function tipAttr(t) { return t ? ' data-tip="' + String(t).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;') + '" role="button" tabindex="0"' : ''; }
            function miniBarCol(barStyle, label, dataAttr, tip) {
                return '<div class="game-day-col"' + tipAttr(tip ? label + ' · ' + tip : '') + '>' +
                    '<div class="game-day-dot" style="' + barStyle + '"' + (dataAttr ? ' ' + dataAttr : '') + '></div>' +
                    '<span style="' + LABEL_STYLE + '">' + label + '</span>' +
                    '</div>';
            }
            // Активността: скалата е до 150%, чертата е целта (100%), над нея лентата е в друг цвят — както калориите.
            var ACT_SCALE = 150;
            function actBar(pct) {
                if (pct==null) return pBar(null);
                return '<div class="game-index-bar-wrap game-act-wrap"><div class="game-index-bar" style="width:0%;background:var(--ds-metric-activity)" data-ga-bar="'+Math.min(100,Math.max(0,pct/ACT_SCALE*100)).toFixed(1)+'"></div>' +
                    '<span class="game-act-target" style="left:'+(100/ACT_SCALE*100).toFixed(1)+'%" aria-hidden="true"></span></div>';
            }
            function miniBarChart(perDayValues, maxVal, color, overColor, tips) {
                var cols = perDayValues.map(function(v,idx){
                    var dow   = new Date(days[idx].key).getDay();
                    var label = DAY_NAMES[(dow+6)%7];
                    var tip = tips ? tips[idx] : (v==null ? 'Няма данни' : v + '%');
                    if(v==null) return miniBarCol('height:'+BAR_MIN_H+'px;background:rgba(156,163,175,0.25)', label, '', tip || 'Няма данни');
                    // 0 е отговор (лош сън, без вода) — показва се в цвят, не като „няма данни“.
                    if(v===0) return miniBarCol('height:'+BAR_MIN_H+'px;background:'+color+';opacity:.55', label, '', tip);
                    var pct2 = maxVal>0?Math.min(100,Math.round(v/maxVal*100)):0;
                    var h    = Math.max(BAR_MIN_H, Math.round(pct2*BAR_MAX_H/100));
                    return miniBarCol('height:'+BAR_MIN_H+'px;background:'+(overColor&&v>100?overColor:color), label, 'data-ga-bar-h="'+h+'px"', tip);
                });
                return '<div class="game-day-dots">'+ cols.join('') +'</div>';
            }
            function calTargetBarChart(perDayConsumed, perDayPlanned, surplusColor, deficitColor) {
                var DEFAULT_SURPLUS_THRESHOLD = 200;
                var LABEL_AREA = 14;
                var planVals = perDayPlanned.filter(function(v){ return v != null && v > 0; });
                var avgPlanned = planVals.length > 0
                    ? Math.round(planVals.reduce(function(a,b){return a+b;},0) / planVals.length)
                    : 2000;
                var TARGET_BAR_PX = Math.round(BAR_MAX_H * 2 / 3);
                var targetLineBottom = LABEL_AREA + TARGET_BAR_PX;
                var cols = perDayConsumed.map(function(v, idx) {
                    var dow   = new Date(days[idx].key).getDay();
                    var label = DAY_NAMES[(dow+6)%7];
                    if (v == null) return miniBarCol('height:'+BAR_MIN_H+'px;background:rgba(156,163,175,0.2)', label, '', 'Няма данни');
                    var consumed = v;
                    var dayPlanned = perDayPlanned[idx] || avgPlanned;
                    var isOverTarget = dayPlanned > 0 ? consumed > dayPlanned : consumed > DEFAULT_SURPLUS_THRESHOLD;
                    var color = isOverTarget ? surplusColor : deficitColor;
                    var pct = dayPlanned > 0 ? consumed / dayPlanned : 0;
                    var h = consumed > 0 ? Math.max(BAR_MIN_H, Math.min(BAR_MAX_H, Math.round(pct * TARGET_BAR_PX))) : BAR_MIN_H;
                    var calTip = Math.round(consumed) + (dayPlanned > 0 ? ' от ' + Math.round(dayPlanned) : '') + ' kcal';
                    return miniBarCol('height:'+BAR_MIN_H+'px;background:'+color, label, 'data-ga-bar-h="'+h+'px"', calTip);
                });
                return '<div class="game-day-dots-cal">' +
                    '<div class="game-cal-target-line" style="bottom:'+targetLineBottom+'px"></div>' +
                    cols.join('') +
                '</div>';
            }
            function ringChart(pct, color, r, shown) {
                r = r||26; var circ=2*Math.PI*r;
                var offset = circ - (pct||0)/100*circ;
                return '<svg class="game-ring-svg" width="'+(r*2+8)+'" height="'+(r*2+8)+'" viewBox="0 0 '+(r*2+8)+' '+(r*2+8)+'">' +
                    '<circle class="game-ring-bg" cx="'+(r+4)+'" cy="'+(r+4)+'" r="'+r+'" stroke-width="5"/>' +
                    '<circle class="game-ring-fg" cx="'+(r+4)+'" cy="'+(r+4)+'" r="'+r+'" stroke-width="5" style="stroke:'+color+'" stroke-dasharray="'+circ+'" stroke-dashoffset="'+circ+'" data-ga-ring-offset="'+offset.toFixed(2)+'"/>' +
                    '<text x="'+(r+4)+'" y="'+(r+4)+'" text-anchor="middle" dominant-baseline="central" style="fill:var(--text-dark);font-size:'+(r>24?'0.9':'0.78')+'rem;font-weight:700;transform:rotate(90deg);transform-origin:'+(r+4)+'px '+(r+4)+'px" data-ga-ring-count="'+(pct!=null?pct:'')+'" data-ga-ring-target="'+(shown!=null?shown:pct!=null?pct:'')+'" >'+(pct!=null?'0%':'—')+'</text>' +
                    '</svg>';
            }

            // ── Build HTML ────────────────────────────────────────────────────
            var html = '';

            // Дните — 7 знака (ябълка или кръг; задържане → смяна). Пълни се по спазването на целия план
            // за деня (GameScoring.dayAdherence): сиво → червено → оранжево → жълто → зеленото на марката.
            // Докосване на ден → какво е свалило процента.
            var softView = false;
            try { softView = !!(window.NutriPlanPersona && window.NutriPlanPersona.current().noScores); } catch (_) {}
            var DAY_SHORT = ['Нд','Пн','Вт','Ср','Чт','Пт','Сб'];
            window._gaDays = starDays.map(function(d){
                var dt = new Date(d.key + 'T12:00:00');
                return { key: d.key, label: DAY_SHORT[dt.getDay()], today: d.key === todayKey, adh: d.rec ? GS.dayAdherence(d.rec, { todayKey: todayKey, key: d.key, group: ADH_GROUP, policy: ADH_POL, weights: ADH_W && ADH_W.weights }) : null, soft: softView };
            });
            // ── Горе: две ленти. Ангажираността (старанието — най-важното за мотивацията) винаги,
            // със звездите на дните под нея; „Напредък“ (мерими промени по целта) — само когато има
            // измерване и тенденция (renderGoalFocus → #gaGoalSlot). Без празна лента.
            var engIcon = '<span class="gf-index-icon"><i class="fas fa-check-double"></i></span>';
            html += '<div class="gf-indices ga-bars">' +
                '<div class="gf-index ga-eng" data-tone="good" data-explain="engagement" role="button" tabindex="0">' +
                    '<div class="gf-index-head">' + engIcon + '<span class="gf-index-name">Ангажираност</span>' +
                    '<span class="gf-index-value">' + (validScores.length ? engagementPct + '%' : '') + '</span></div>' +
                    '<div class="gf-index-bar"><span style="width:' + (validScores.length ? engagementPct : 0) + '%"></span></div>' +
                    '<div class="ga-days" id="gaDays" aria-label="Последните 7 дни"></div>' +
                '</div>' +
                '<div id="gaGoalSlot"></div>' +
            '</div>';


            // ── Кръговете: всеки показател със седмичния си процент (същите формули като сървъра),
            // подредени по важност за целта (goal-focus.js → checkOrder). Докосване — обяснение + история.
            // Седмичен процент (weekMetrics: дните без отговор — 0); без нито един отговор за седмицата — няма кръг.
            var ring = function(v, c, label, icon, shown) { return v == null ? null : { v: v, shown: shown, c: c, label: label, icon: icon }; };
            var RINGS = {
                calories: ring(calAdherencePct, '#F59E0B', 'Калории', 'fa-scale-balanced'),
                activity: ring(actPct, MC.act.c, 'Активност', 'fa-person-walking', actRawPct),
                sleep: ring(sleepPct, MC.sleep.c, 'Сън', 'fa-moon'),
                stress: ring(balancePct, MC.mood.c, 'Емоции', 'fa-face-smile'),
                water: ring(waterPct, MC.water.c, 'Вода', 'fa-droplet')
            };
            var ringOrder = ['calories', 'activity', 'sleep', 'stress', 'water'];
            try {
                var GFo = window.NutriPlanGoalFocus;
                if (GFo) { var co = GFo.checkOrder(GFo.profileOf(JSON.parse(localStorage.getItem('userData') || '{}'))); ringOrder.sort(function(a, b){ return (co.indexOf(a) + 99) % 99 - (co.indexOf(b) + 99) % 99; }); }
            } catch (_) {}
            // Показателите за кръговете — рисува ги gaRenderRings() в избрания вид (задържане → избор).
            window._gaRingItems = ringOrder.filter(function(k){ return RINGS[k]; }).map(function(k){ return Object.assign({ k: k }, RINGS[k]); });
            if (alerts.length) html += '<div class="game-alert-card ga-card-enter" style="animation-delay:0.2s">'+alerts[0]+'</div>';
            else if (encourageText) html += '<div class="game-encourage-note ga-card-enter" style="animation-delay:0.2s">'+encourageText+'</div>';
            // Показателите — в избрания вид (иконите по подразбиране); задържане → всички видове за избор.
            // Докосване на показател отваря само неговия седмичен ред отдолу.
            if (window._gaRingItems.length) html += '<div id="gaRings" class="ga-rings-wrap ga-card-enter" style="animation-delay:0.1s"></div>';

            // Едно нещо, върху което да се съсредоточиш: най-важното предупреждение, иначе насърчението.

            html += '<div id="gameMetricsDetails" style="display:none;">';

            html += '<div class="game-index-row" data-explain="engagement">' +
                '<div class="game-index-label"><span><i class="fas fa-utensils" style="color:#03939C"></i> Ангажираност</span><span>'+engagementPct+'%</span></div>' +
                '<div class="game-index-hint">'+(!validScores.length?'<i class="fas fa-seedling" style="color:#10b981"></i> Започваш — отбелязвай храненията си':engagementPct>=80?'<i class="fas fa-check-circle" style="color:#10b981"></i> Отлично':engagementPct>=60?'<i class="fas fa-circle" style="color:#f59e0b"></i> Добре':'<i class="fas fa-circle" style="color:#ef4444"></i> Нисък')+(mealAdherencePct!=null?' · спазени хранения '+mealAdherencePct+'%':'')+' <i class="fas fa-circle-info"></i></div>' +
                pBar(engagementPct,'linear-gradient(90deg,#03939C,#06B6D4)') + miniBarChart(engPcts,100,'#03939C') +
            '</div>';


            var hasDeficit = calBalanceByDay.some(function(v){ return v!==null && v<-50; });
            var calBalanceLabel;
            if (!calBalanceByDay.some(function(v){ return v !== null; })) {
                calBalanceLabel = '<i class="fas fa-circle-info" style="color:#94a3b8"></i> Няма данни';
            } else if (netCalBalance === 0 && !hasDeficit) {
                calBalanceLabel = '<i class="fas fa-check-circle" style="color:#10b981"></i> Балансиран';
            } else if (netCalBalance > 0) {
                calBalanceLabel = netCalBalance < 700
                    ? '<i class="fas fa-circle" style="color:#f59e0b"></i> Нетен излишък'
                    : '<i class="fas fa-circle" style="color:#ef4444"></i> Голям излишък';
            } else {
                calBalanceLabel = '<i class="fas fa-arrow-down" style="color:#3b82f6"></i> Нетен дефицит';
            }
            html += '<div class="game-index-row" data-explain="calories">' +
                '<div class="game-index-label"><span><i class="fas fa-scale-balanced" style="color:#f59e0b"></i> Калориен баланс</span><span>'+(calBalanceByDay.some(function(v){ return v!==null; }) ? (netCalBalance>0?'+':'')+netCalBalance+' kcal' : '—')+'</span></div>' +
                '<div class="game-index-hint">'+calBalanceLabel+' <i class="fas fa-circle-info"></i></div>' +
                (calBalanceByDay.some(function(v){ return v!==null; }) ? '' : '<div class="game-index-bar-wrap"></div>') +
                (!calBalanceByDay.some(function(v){ return v!==null; }) ? '' : pBar(calAdherencePct, netCalBalance>700?'linear-gradient(90deg,#ef4444,#f97316)':netCalBalance>0?'linear-gradient(90deg,#f59e0b,#fbbf24)':'linear-gradient(90deg,#3b82f6,#06B6D4)')) +
                calTargetBarChart(calConsumedByDay, calPlannedByDay, netCalBalance>700?'#ef4444':'#f59e0b', '#3b82f6') +
            '</div>';

            if(balancePct!=null) html += '<div class="game-index-row" data-explain="stress">' +
                '<div class="game-index-label">'+metricName(MC.mood,'Емоции')+'<span>'+balancePct+'%</span></div>' +
                '<div class="game-index-hint">'+metricLevel(MC.mood, moodLabel(balancePct))+'</div>' +
                pBar(balancePct,MC.mood.c) + miniBarChart(balanceByDay,100,MC.mood.c,null,balanceTips) +
            '</div>';

            if(sleepPct!=null) html += '<div class="game-index-row" data-explain="sleep">' +
                '<div class="game-index-label">'+metricName(MC.sleep,'Сън')+'<span>'+sleepPct+'%</span></div>' +
                '<div class="game-index-hint">'+metricLevel(MC.sleep, levelLabel(sleepPct))+'</div>' +
                pBar(sleepPct,MC.sleep.c) + miniBarChart(sleepByDay,100,MC.sleep.c,null,sleepTips) +
            '</div>';

            if(actPct!=null) html += '<div class="game-index-row" data-explain="activity">' +
                '<div class="game-index-label">'+metricName(MC.act,'Активност')+'<span>'+actRawPct+'%</span></div>' +
                '<div class="game-index-hint">'+metricLevel(MC.act, actLevel(actRawPct))+'</div>' +
                actBar(actRawPct) + miniBarChart(actRawByDay,ACT_SCALE,MC.act.c,MC.act.c,actTips) +
                (actExtraBurn>0 ? '<div class="game-index-hint" style="margin-top:4px"><i class="fas fa-fire-flame-curved" style="color:var(--ds-metric-activity)"></i> ~'+actExtraBurn+' kcal допълнителен разход в '+actOverDays+' '+(actOverDays===1?'ден':'дни')+' — реалният дефицит е по-голям; влиза в седмичния преглед на плана</div>' : '') +
            '</div>';

            if(waterPct!=null) html += '<div class="game-index-row" data-explain="water">' +
                '<div class="game-index-label">'+metricName(MC.water,'Хидратация')+'<span>'+waterPct+'%</span></div>' +
                '<div class="game-index-hint">'+metricLevel(MC.water, levelLabel(waterPct, true))+'</div>' +
                pBar(waterPct,MC.water.c) + miniBarChart(waterByDay,100,MC.water.c,null,waterTips) +
            '</div>';

            if(noDataDaysCount>0) html += '<div class="game-no-data-note"><i class="fas fa-calendar-xmark"></i> ' + noDataDaysCount + ' ' + (noDataDaysCount===1?'ден':'дни') + ' без отбелязана активност (не влизат в средните стойности)</div>';

            if(insights.length>0){
                html += '<div class="game-section-title">Корелации и открития</div>';
                insights.forEach(function(ins, ii){ html += '<div class="game-insight-card ga-card-enter" style="animation-delay:'+(0.05+ii*0.08)+'s">'+ins+'</div>'; });
            }

            html += '<div id="gaDeviceSlot"></div>';
            var weeklyInfo={};
            try { weeklyInfo=JSON.parse(localStorage.getItem('gameWeeklyAI')||'{}'); } catch(e) {}
            if(weeklyInfo.nextDue){ var nd=new Date(weeklyInfo.nextDue); html += '<div class="game-weekly-info"><i class="fas fa-calendar-check"></i> Следващ седмичен преглед: '+nd.toLocaleDateString('bg-BG')+'</div>'; }

            html += '</div>'; // close gameMetricsDetails
            html += '<div class="game-metrics-toggle ga-card-enter" style="animation-delay:0.28s" id="gameMetricsToggle" onclick="toggleDetailedMetrics()" role="button" tabindex="0" aria-expanded="false" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();toggleDetailedMetrics();}">' +
                '<div class="game-section-title" style="margin:0">Подробно</div>' +
                '<i class="fas fa-chevron-down game-metrics-chevron" id="gameMetricsChevron"></i>' +
            '</div>';

            // Точните числа — само в обясненията (докосване), не на екрана.
            gaNumbers = {
                engagement: 'Твоите числа: ангажираност ' + engagementPct + '%' + (mealAdherencePct!=null ? ', спазени хранения ' + mealAdherencePct + '%' : '') + '.',
                calories: calBalanceByDay.some(function(v){ return v!==null; }) ? 'Твоите числа: нетен баланс за седмицата ' + (netCalBalance>0?'+':'') + netCalBalance + ' kcal.' : '',
                stress: balancePct!=null ? 'Твоите числа: ' + balancePct + '% — ' + moodLabel(balancePct) + '.' : '',
                sleep: sleepPct!=null ? 'Твоите числа: сън ' + sleepPct + '%.' : '',
                activity: actPct!=null ? 'Твоите числа: ' + actRawPct + '% от целта' + (actStepsAvg!=null ? ', средно ~' + fmtSteps(actStepsAvg) + ' крачки на ден при цел ' + fmtSteps(actTarget) : '') + (actExtraBurn>0 ? '. Допълнителен разход ~' + actExtraBurn + ' kcal в ' + actOverDays + ' ' + (actOverDays===1?'ден':'дни') : '') + '.' : '',
                water: waterPct!=null ? 'Твоите числа: хидратация ' + waterPct + '%.' : '',
                health: healthScore!=null ? 'Твоите числа: навици ' + healthScore + '%.' : ''
            };
            body.innerHTML = html;

            // Показателите — по важност за целта (goal-focus.js).
            try {
                var GF = window.NutriPlanGoalFocus;
                var details = document.getElementById('gameMetricsDetails');
                if (GF && details) {
                    var ud = JSON.parse(localStorage.getItem('userData') || '{}');
                    var order = GF.checkOrder(GF.profileOf(ud));
                    var rows = Array.prototype.slice.call(details.querySelectorAll(':scope > .game-index-row'));
                    var anchor = rows.length ? rows[rows.length - 1].nextSibling : null;
                    rows.sort(function (a, b) { return order.indexOf(a.dataset.explain) - order.indexOf(b.dataset.explain); })
                        .forEach(function (r) { details.insertBefore(r, anchor); });
                }
            } catch (_) {}
            window._gaChecks = {
                engagementPct: validScores.length ? engagementPct : null,
                mealAdherence: mealAdherencePct, calAdherence: calAdherencePct,
                sleepPct: sleepPct, actPct: actPct, balancePct: balancePct,
                junkCount: validScores.length ? junkCount7 : null,
                // дни с тренировка (вечерният въпрос) — за „Напредък“, когато тренировките са водещи
                workouts7: days.some(function(d){ return d.rec && d.rec.eveningCheck && d.rec.eveningCheck.trained != null; })
                    ? days.filter(function(d){ var t = d.rec && d.rec.eveningCheck && d.rec.eveningCheck.trained; return t === 'am' || t === 'pm' || t === true; }).length : null
            };
            renderGoalFocus();

            // ── Trigger entrance animations after DOM is painted ─────────────
            var GA_RING_START   = 120;
            var GA_RING_STAGGER = 130;
            var GA_RING_COUNTER = 900;
            var GA_BAR_START    = 350;
            var GA_BAR_STAGGER  = 60;
            var GA_CHART_START  = 400;
            var GA_CHART_STAGGER= 25;
            requestAnimationFrame(function() {
                requestAnimationFrame(function() {
                    body.querySelectorAll('[data-ga-ring-offset]').forEach(function(el, i) {
                        setTimeout(function() {
                            el.style.strokeDashoffset = el.getAttribute('data-ga-ring-offset');
                        }, GA_RING_START + i * GA_RING_STAGGER);
                    });

                    body.querySelectorAll('[data-ga-ring-target]').forEach(function(el, i) {
                        var target = parseInt(el.getAttribute('data-ga-ring-target'), 10);
                        if (isNaN(target)) { el.textContent = '—'; return; }
                        var start = GA_RING_START + i * GA_RING_STAGGER;
                        var duration = GA_RING_COUNTER;
                        var startTime = null;
                        function step(ts) {
                            if (!startTime) startTime = ts;
                            var elapsed = ts - startTime;
                            if (elapsed < 0) { requestAnimationFrame(step); return; }
                            var progress = Math.min(elapsed / duration, 1);
                            var ease = 1 - Math.pow(1 - progress, 3);
                            el.textContent = Math.round(target * ease) + '%';
                            if (progress < 1) requestAnimationFrame(step);
                        }
                        setTimeout(function() { requestAnimationFrame(step); }, start);
                    });

                    body.querySelectorAll('[data-ga-bar]').forEach(function(el, i) {
                        setTimeout(function() {
                            el.style.width = el.getAttribute('data-ga-bar') + '%';
                        }, GA_BAR_START + i * GA_BAR_STAGGER);
                    });

                    body.querySelectorAll('[data-ga-bar-h]').forEach(function(el, i) {
                        setTimeout(function() {
                            el.style.height = el.getAttribute('data-ga-bar-h');
                        }, GA_CHART_START + i * GA_CHART_STAGGER);
                    });

                    body.querySelectorAll('[data-ga-bidir-h]').forEach(function(el, i) {
                        setTimeout(function() {
                            el.style.height = el.getAttribute('data-ga-bidir-h');
                        }, GA_CHART_START + i * GA_CHART_STAGGER);
                    });
                });
            });

            // Attach explain handlers
            body.querySelectorAll('.game-day-col[data-tip]').forEach(function(col){
                var open = function(e){ e.stopPropagation(); showDayTip(col); };
                col.addEventListener('click', open);
                col.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); open(e); } });
            });
            _gaPicked = []; _gaAll = false;
            gaRenderRings();
            gaRenderDays();
            body.querySelectorAll('[data-explain]').forEach(function(el){
                el.addEventListener('click', function(){ showExplanation(el.getAttribute('data-explain')); });
            });
        }
        // ── End Current Analysis Loader ──────────────────────────────────────
        // Initial load
        loadGameAnalytics();
        // Reload data every time the tab becomes active (e.g. after plan.html updates gameData)
        window.addEventListener('NUTRIPLAN_TAB_ACTIVATED', function() { loadGameAnalytics(); });
    </script>

    <script>
        function requestShellAction(type, payload) {
            if (document.documentElement.getAttribute('data-embedded-tab') !== '1' || !window.parent || window.parent === window) return false;
            try { window.parent.postMessage(Object.assign({ type: type }, payload || {}), window.location.origin); return true; } catch (_) { return false; }
        }
    </script>

    <!-- Chat Assistant Button -->
    <button class="fab-chat" onclick="if(!requestShellAction('NUTRIPLAN_OPEN_CHAT'))window.location.href='plan.html?chat=1'" aria-label="Отвори чат асистент">
        <img src="./docs/Chat2.png" alt="" class="chat-icon-img" aria-hidden="true">
    </button>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav" aria-label="Основна навигация">
        <a href="index.html?app=1&tab=plan" class="bottom-nav-item">
            <i class="fas fa-utensils"></i>
            <span>Моят План</span>
        </a>
        <a href="index.html?app=1&tab=guidelines" class="bottom-nav-item">
            <i class="fas fa-compass"></i>
            <span>Насоки</span>
        </a>
        <a href="index.html?app=1&tab=analytics" class="bottom-nav-item active" aria-current="page">
            <i class="fas fa-chart-bar"></i>
            <span>Напредък</span>
        </a>
        <a href="index.html?app=1&tab=profile" class="bottom-nav-item">
            <i class="fas fa-user"></i>
            <span>Профил</span>
        </a>
    </nav>
</body>
</html>
