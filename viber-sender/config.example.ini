[sender]
; адресът на worker-а
worker_url = https://aidiet.radilov-k.workers.dev
; същият низ като XBODY_VIBER_TOKEN в Cloudflare (поне 16 знака)
token =
; през колко секунди се питат за нови съобщения
poll_seconds = 120
; колко секунди Viber Desktop отваря чата (по-бавен компютър → повече)
open_wait_seconds = 4
; пауза между две съобщения (случайна, в секунди)
gap_seconds = 25-60
; праща само в тези часове
hours = 8-21
